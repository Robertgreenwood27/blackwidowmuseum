title: The Widows
kicker: Latrodectus Walckenaer, 1805
summary: Latrodectus is a genus of comb-footed spiders. Its species share one anatomical toolkit, while their colour, size, habitat and mating behaviour vary far more than the "black with a red hourglass" image suggests.
