observations:
  - id: family
    text: Latrodectus belongs to Theridiidae, the cobweb or comb-footed spiders.
    sources: [wsc2026, miller2007]
  - id: count
    text: The World Spider Catalog recognises 35 species of Latrodectus as of November 2026.
    sources: [wsc2026]
  - id: atlas
    text: A November 2026 atlas of the genus recognises 39 named species instead — the two treatments have not yet converged.
    confidence: debated
    sources: [miller2026]
  - id: diagnosis
    text: The genus is recognised by a combination of characters — a large colulus, toothless chelicerae, widely separated lateral eyes and its genitalia.
    sources: [lotz1994]
  - id: comb
    text: The comb of serrated bristles on the fourth legs is shared with the rest of the family, not unique to widows.
    sources: [lotz1994, jocque2006]
  - id: shapes
    text: Female abdomens are usually globe-shaped; males are slimmer and more elongate.
    sources: [lotz1994]
  - id: ducts
    text: Females store sperm in paired receptacles reached by coiled copulatory ducts.
    sources: [lotz1994]
  - id: embolus
    text: The male palp carries a long, coiled embolus that delivers sperm.
    sources: [lotz1994]
  - id: size
    text: Kaston measured female southern widows at 5–13.5 mm and males at 2.9–5.1 mm.
    sources: [kaston1970]
  - id: dimorphism
    text: How much bigger females are than males varies from species to species.
    confidence: supported
    sources: [kaston1970, australianmuseum2026]
  - id: two-clades
    text: DNA splits the sampled widows into two major clades — the brown widow's relatives and nearly everyone else.
    confidence: supported
    sources: [garb2004]
  - id: behaviour
    text: Five widow species mated under identical laboratory conditions with clearly different courtship and outcomes.
    confidence: supported
    sources: [baruffaldi2024]
terms:
