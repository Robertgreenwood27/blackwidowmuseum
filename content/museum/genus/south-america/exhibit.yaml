id: genus.south-america
accession: BWM-06.12
title: South America's Widows
kicker: Local names hide a tangled species history
summary: South America holds more widow species than any other continent, and their names are still being argued over. Field studies stay useful as long as they keep the name the authors used.
status: open
order: 12
taxa: [Latrodectus mirabilis, Latrodectus thoracicus, Latrodectus corallinus, Latrodectus antheratus, Latrodectus diaguita, Latrodectus variegatus, Latrodectus lucacha]
