observations:
  - id: accepted
    text: L. antheratus, L. diaguita, L. quartus and L. variegatus are each accepted as separate species.
    sources: [wsc2026]
  - id: corallinus
    text: L. corallinus is catalogued from Panama, Brazil and Argentina.
    sources: [wsc2026]
  - id: garbae
    text: The catalogue now treats the Colombian L. garbae as the same species as L. corallinus.
    sources: [wsc2026, zabalacruz2026]
  - id: disputed
    text: A November 2026 atlas disagrees, keeping L. garbae and merging L. mirabilis into L. thoracicus.
    confidence: debated
    sources: [miller2026]
  - id: thoracicus
    text: Chile's L. thoracicus was restored as a species in 2009 on biological and DNA evidence.
    confidence: supported
    sources: [aguilera2009]
  - id: ants
    text: Ants dominated the prey of widows in Argentine wheat and oat fields.
    confidence: supported
    sources: [pompozzi2013]
  - id: leafcutters
    text: In laboratory trials the same widows caught leaf-cutting ants.
    confidence: supported
    sources: [pompozzi2013]
  - id: pompoms
    text: Some South American widows hang detachable pompoms on their egg sacs — brown widows are not the only ornamenters.
    confidence: supported
    sources: [miller2026b]
