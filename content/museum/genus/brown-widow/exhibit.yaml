  - id: faster
    text: Florida brown widows grew up and matured faster than southern black widows.
    confidence: supported
    sources: [coticchio2023]
  - id: eats-widows
    text: Housed together, brown widows attacked and ate southern black widows.
    confidence: supported
    sources: [coticchio2023]
  - id: dispersal
    text: Spiderlings disperse both by rappelling down silk and by ballooning on the wind.
