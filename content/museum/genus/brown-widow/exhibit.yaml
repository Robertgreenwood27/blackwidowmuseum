title: The Brown Widow
kicker: A travelling widow with a spiked nursery
summary: Latrodectus geometricus has spread from Africa across much of the warm world, usually into buildings and gardens. Its spiked egg sacs, airborne spiderlings and appetite for other widows make it the best-documented widow invader.
