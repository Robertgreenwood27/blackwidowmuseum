  - id: africa
    text: The World Spider Catalog treats Africa as the brown widow's native region and lists introductions on most continents.
    sources: [wsc2026]
  - id: colour
    text: Mature females range from tan through brown to very dark.
    sources: [vetter2017]
  - id: hourglass
    text: The brown widow usually has an orange hourglass beneath its abdomen; the colour varies toward red-orange or yellow.
    sources: [vetter2017]
  - id: sac
    text: Its rounded egg sacs are covered with pointed silk projections — a strong identification mark.
    sources: [vetter2017]
  - id: refuges
    text: In laboratory choices, females preferred deep, corrugated refuges with tight angles.
    confidence: supported
