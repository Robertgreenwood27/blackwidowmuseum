id: genus.naming
accession: BWM-06.16
title: Naming the Widows
kicker: A name can survive while its species changes
summary: Widow names have swung from many, to six, and back to dozens. In 1959 Levi lumped most of the world's widows under mactans; revisions since have split them apart again — and the newest atlas and the catalogue still disagree.
status: open
order: 16
taxa: [Latrodectus]
