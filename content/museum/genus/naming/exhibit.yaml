observations:
  - id: walckenaer
    text: The genus is credited to Walckenaer, 1805.
    sources: [wsc2026]
  - id: type
    text: Its type species is L. tredecimguttatus, first described by Rossi.
    sources: [wsc2026]
  - id: levi
    text: Levi's 1959 revision placed many regional names under a broad L. mactans.
    sources: [levi1959, wsc2026]
  - id: north-america
    text: Later North American work separated species that the broad system hid.
    sources: [mccrone1964, kaston1970]
  - id: africa
    text: Lotz restored African species from morphology and natural history.
    sources: [lotz1994]
  - id: chacoca
    text: The genus name Chacoca is now a junior synonym of Latrodectus.
    sources: [wsc2026]
  - id: integrative
    text: The 2023 description of L. occidentalis combined DNA, anatomy and range modelling.
    sources: [valdezmondragon2023]
  - id: garbae
    text: The catalogue follows a July 2026 study merging L. garbae into L. corallinus.
    sources: [wsc2026, zabalacruz2026]
  - id: disagree
    text: The November 2026 atlas rejects that merger.
    confidence: debated
    sources: [miller2026]
  - id: not-discovery
    text: Species counts rise and fall with revalidations and mergers — a new name is not always a new animal.
    sources: [wsc2026, miller2026]
