observations:
  - id: overlap
    text: The markings of North American adult female widows overlap and vary within each species.
    sources: [kaston1970]
  - id: juveniles
    text: Juveniles can look very different from adult females.
    sources: [kaston1970]
  - id: males
    text: Mature males keep different proportions and markings from females.
    sources: [kaston1970]
  - id: brown-lookalike
    text: A brown widow's mottled body and banded legs can resemble a young western widow.
    sources: [vetter2017]
  - id: sacs-better
    text: In North America, a brown widow's spiked sac is a better clue than its colour.
    confidence: supported
    sources: [vetter2017]
  - id: not-unique
    text: Some South American widows also ornament their sacs.
    confidence: supported
    sources: [miller2026b]
  - id: spotless
    text: An all-black Mediterranean widow is still L. tredecimguttatus.
    sources: [nentwig2026b]
  - id: microscope
    text: Genital ducts and abdominal hairs separate regional species that look alike.
    sources: [melic2000, lotz1994]
  - id: false-widows
    text: False widows belong to Steatoda, a different genus in the same family.
    sources: [vetter2017]
  - id: no-hourglass
    text: A missing red mark does not rule a spider in or out as a widow.
    confidence: supported
    sources: [vetter2017, lotz1994]
