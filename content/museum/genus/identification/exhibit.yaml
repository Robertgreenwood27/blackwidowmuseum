id: genus.identification
accession: BWM-06.19
title: Telling Them Apart
kicker: Look beyond the red mark
summary: Identifying a widow means weighing where it was found, its sex and age, its markings and its egg sac. Where colour patterns overlap, only a microscope will settle it.
status: open
order: 19
taxa: [Latrodectus mactans, Latrodectus variolus, Latrodectus geometricus, Latrodectus tredecimguttatus, Steatoda]
