  - id: round-sacs
    text: Their egg sacs were rounder than those of western and northern widows.
    confidence: supported
    sources: [kaston1970]
  - id: males-survive
    text: Males inseminated several females in turn — they are not always eaten.
    confidence: supported
    sources: [breene1985]
  - id: crosses
    text: Southern–western pairings occasionally inseminated, but the eggs never developed.
    confidence: supported
    sources: [kaston1970]
  - id: brown-widows
    text: In Florida trials, brown widows killed southern black widows.
    confidence: supported
    sources: [coticchio2023]
  - id: disappearing
    text: The authors propose this predation as one reason southern widows vanish from urban structures.
    confidence: debated
    sources: [coticchio2023]
