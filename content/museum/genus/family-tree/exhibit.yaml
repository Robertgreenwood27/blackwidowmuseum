title: The Family Tree
kicker: A branching hypothesis, with dates that carry uncertainty
summary: DNA splits the widows into two great branches — the brown widow's relatives and nearly everyone else. A 2026 analysis dates the last common ancestor of living widows to about 36 million years ago, with wide error bars.
status: open
order: 15
taxa: [Latrodectus, Steatoda]
