id: genus.roster
accession: BWM-06.14
title: The Catalogued Widows
kicker: Thirty-five accepted names
summary: Every species the World Spider Catalog accepted on 23 November 2026 — two and a half centuries of naming, from Fabricius in 1775 to an Andean widow in 2026.
status: open
order: 14
taxa: [Latrodectus]
figures:
  - value: 35
    label: species in the checked catalogue
    note: synonyms and doubtful names excluded
    featured: true
    sources: [wsc2026]
  - value: 1775
    label: oldest name
    note: L. mactans
    sources: [wsc2026]
  - value: 2026
    label: newest name
    note: L. lucacha
    sources: [wsc2026, miller2026b]
  - value: "+4"
    label: names in the November 2026 atlas
    note: seven revalidated, three merged; 39 in all
    sources: [miller2026]
observations:
  - id: snapshot
    text: The checked World Spider Catalog list holds the 35 species below.
    sources: [wsc2026]
  - id: garbae
    text: L. garbae is left out because the catalogue treats it as a synonym of L. corallinus.
    sources: [wsc2026]
  - id: atritus
    text: L. atritus is not an extra species; it is the katipō.
    sources: [wsc2026]
  - id: mirabilis
    text: L. mirabilis stays on the list here, although the newer atlas merges it into L. thoracicus.
    confidence: debated
    sources: [wsc2026, miller2026]
  - id: introduced
    text: Ranges are catalogue summaries. A country on the list is not proof the species is native there.
    sources: [wsc2026]
terms:
  - { term: binomial, def: the two-part scientific name — genus plus species }
  - { term: authority, def: the author and year of a name; parentheses mean it was first placed in another genus }
