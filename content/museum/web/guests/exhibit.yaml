observations:
  - id: diet
    text: Western widows ate ground-active arthropods from several orders over a year-long coastal study.
    sources: [salomon2011]
  - id: egg-thief
    text: The kleptoparasite Argyrodes pluto stole western widow egg sacs and ate the eggs and spiderlings.
    confidence: supported
    sources: [cowles2025]
  - id: gleaner
    text: Neospintharus baboquivari gleaned small prey from western widow webs in southern Arizona.
    confidence: supported
    sources: [cowles2025]
  - id: timing
    text: Egg-sac thieves struck while the host was busy wrapping prey.
    confidence: supported
    sources: [cowles2025]
  - id: not-killers
    text: The Arizona study did not see A. pluto or Mimetus kill an adult western widow.
    confidence: supported
    sources: [cowles2025]
  - id: mud-daubers
    text: Mud-dauber nest contents show southern black widows stored as food for wasp larvae.
    sources: [dean1988]
  - id: skink
    text: A published redback record documents predation on a weasel skink.
    confidence: supported
    sources: [oshea2017]
  - id: snakes
    text: Published records also document widows catching and feeding on snakes — rare events, not typical prey.
    confidence: supported
    sources: [nyffeler2021]
