observations:
  - id: masp
    text: Black widow dragline silk is built mainly from the spidroins MaSp1 and MaSp2.
    sources: [ayoub2007]
  - id: genes
    text: Complete MaSp1 and MaSp2 genes were first sequenced in the western black widow, L. hesperus.
    sources: [ayoub2007]
  - id: layout
    text: Both proteins have long repetitive interiors bounded by non-repetitive ends.
    sources: [ayoub2007]
  - id: motifs
    text: MaSp1 repeats glycine-rich motifs between runs of alanine; MaSp2 adds proline- and glutamine-rich motifs.
    sources: [ayoub2007]
  - id: crystals
    text: Alanine-rich regions form crystals that give strength, while looser regions let the fibre stretch.
    confidence: supported
    sources: [gosline1999]
  - id: more-than-two
    text: Proteomics of widow dragline found further proteins, including AcSp1 and several small proteins.
    sources: [larracas2016]
  - id: not-barcodes
    text: Silk genes are expressed beyond their namesake glands, so no gland is a one-gene factory.
    confidence: supported
    sources: [clarke2017]
  - id: glue-proteins
    text: Gumfoot material adds aggregate spidroins and modified proteins associated with adhesion.
    confidence: supported
    sources: [ayoub2021]
