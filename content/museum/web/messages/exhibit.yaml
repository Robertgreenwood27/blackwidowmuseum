id: web.messages
accession: BWM-03.10
title: Silk Carries Messages
kicker: A web is also a letter
summary: A female's silk is scented with pheromone that tells males who she is and whether she is mated. Courting males answer by cutting her web apart and drumming on what remains.
status: open
order: 10
taxa: [Latrodectus hesperus, Latrodectus hasselti]
