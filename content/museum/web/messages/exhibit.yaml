observations:
  - id: pheromone
    text: Female western widow silk carries an identified serine methyl ester that stimulates male courtship.
    sources: [scott2015b]
  - id: second
    text: A second contact component was found later, and a synthetic blend triggered courtship.
    confidence: supported
    sources: [fischer2025]
  - id: airborne
    text: In the field, synthetic isobutyric acid attracted male western widows through the air.
    confidence: supported
    sources: [fischer2025]
  - id: summer
    text: Web pheromone levels peaked in summer across a year of field sampling.
    confidence: supported
    sources: [fischer2025]
  - id: reduction
    text: Courting males cut and bundle the female's silk while adding their own.
    sources: [scott2015]
  - id: rivals
    text: Male-reduced webs drew fewer rivals; removing the same silk experimentally did not.
    confidence: supported
    sources: [scott2015]
  - id: male-silk
    text: Adding male silk alone did not make intact webs less attractive.
    confidence: supported
    sources: [scott2015]
  - id: calmer
    text: Web-reducing males met fewer aggressive responses and calmer females.
    confidence: supported
    sources: [scott2012]
  - id: virgin
    text: Redback males could tell virgin-female silk from silk spun just after mating.
    confidence: supported
    sources: [stoltz2007]
  - id: whispers
    text: Low-amplitude male vibrations are less likely to trigger a female's predatory response.
    confidence: supported
    sources: [vibert2014]
  - id: sequences
    text: Later in courtship, western widow males combine vibrations into more stereotyped sequences.
    confidence: supported
    sources: [sivalinghem2021]
terms:
  - { term: contact pheromone, def: a chemical signal detected by touching it }
  - { term: web reduction, def: a courting male's cutting, bundling and over-wrapping of the female's web }
  - { term: tremulation, def: rapid body oscillation that sends vibrations through silk }
