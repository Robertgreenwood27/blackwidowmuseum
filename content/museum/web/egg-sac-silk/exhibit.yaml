observations:
  - id: core
    text: Large egg-case fibres contain TuSp1 together with the egg-case proteins ECP-1 and ECP-2.
    sources: [hu2006]
  - id: ecp
    text: ECP-1 and ECP-2 have cysteine-rich regions and differ from the repeat-rich spidroins.
    sources: [hu2006, shanafelt2021]
  - id: ecp3
    text: A third component, ECP3, was later found, expressed mainly in the tubuliform glands.
    confidence: supported
    sources: [shanafelt2021]
  - id: fine
    text: Aciniform spidroin occurs in the sac's fine fibres — the same protein found in prey-wrapping silk.
    sources: [vasanthavada2007]
  - id: timing
    text: TuSp1, ECP-1 and ECP-2 transcripts rise before egg-sac production, each at its own point in development.
    confidence: supported
    sources: [casem2010]
  - id: layers
    text: A western widow sac encloses the egg mass, a gap of air, and an outer silk membrane.
    confidence: supported
    sources: [karkosiak2025]
  - id: air
    text: Porous silk conserves water by shielding a pocket of still air from wind, not by being watertight.
    confidence: supported
    sources: [karkosiak2025]
  - id: synthetic
    text: Recombinant TuSp1 fibres stretched further when the protein's conserved C-terminal end was kept.
    confidence: supported
    sources: [gnesa2012]
terms:
  - { term: tubuliform silk, def: the female-only silk used to build egg cases; also called cylindrical silk }
  - { term: ECP, def: egg-case protein — ECP-1, ECP-2 and ECP3 are distinct from TuSp1 }
  - { term: porosity, def: the fraction of a membrane that is open space }
