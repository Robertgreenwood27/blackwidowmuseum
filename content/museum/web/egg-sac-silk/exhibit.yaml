id: web.egg-sac-silk
accession: BWM-03.04
title: Egg-Case Silk
kicker: A nursery of a different fibre
summary: The egg sac is a composite — thick tubuliform fibres woven with fine aciniform ones, around a pocket of still air that slows the eggs drying out.
status: open
order: 4
taxa: [Latrodectus hesperus, Latrodectus mactans, Latrodectus variolus]
