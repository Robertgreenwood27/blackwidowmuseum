observations:
  - id: comb
    text: Serrated bristles on the fourth legs help theridiids cast sticky silk onto prey.
    sources: [miller2007]
  - id: aciniform
    text: Western widow prey-wrap contains aciniform spidroin.
    sources: [vasanthavada2007]
  - id: minor
    text: Minor ampullate proteins are also part of the wrap.
    sources: [lamattina2008]
  - id: strokes
    text: Brown widows wrap with both simultaneous and alternating strokes of the fourth legs.
    confidence: supported
    sources: [barrantes2007]
  - id: alternate
    text: Redbacks can alternate bites with further layers of sticky and dry wrapping silk.
    confidence: supported
    sources: [forster1995]
  - id: flexible
    text: Sluggish prey may be bitten before it is wrapped, so the attack order is flexible.
    confidence: supported
    sources: [forster1995]
  - id: wasps
    text: A captive redback repeatedly pinned down common wasps with silk before biting them.
    confidence: supported
    sources: [vanhelsdingen2019]
  - id: carry
    text: It then cut the surrounding threads and hauled the wrapped wasp toward its retreat.
    confidence: supported
    sources: [vanhelsdingen2019]
