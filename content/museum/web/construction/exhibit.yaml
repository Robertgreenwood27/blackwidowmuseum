observations:
  - id: reinforce
    text: Brown widows reinforce structural threads and build on existing silk as the web expands.
    confidence: supported
    sources: [benjamin2003]
  - id: gumfoot-sequence
    text: To lay a gumfoot, a brown widow descends, anchors the line to the ground, then climbs back up.
    confidence: supported
    sources: [benjamin2003]
  - id: bouts
    text: Between gumfoot lines she travels along structural threads to the next site.
    confidence: supported
    sources: [benjamin2003]
  - id: paired
    text: In western widows that down-and-up route produces paired fibres of different diameters.
    confidence: supported
    sources: [blackledge2005b]
  - id: retreat
    text: Brown widow construction includes a silk-lined retreat.
    confidence: supported
    sources: [benjamin2003]
  - id: nightly
    text: Desert widows repair their webs and renew sticky capture threads at night.
    confidence: supported
    sources: [lubin1991]
  - id: starving
    text: Starving redbacks can eventually lose the ability to spin, yet their existing webs keep catching prey.
    confidence: supported
    sources: [forster1989]
  - id: not-orb
    text: None of this follows the radius-and-spiral sequence of orb weavers.
    sources: [benjamin2003]
