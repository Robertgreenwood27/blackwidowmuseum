observations:
  - id: araneoidea
    text: Theridiidae sits within Araneoidea, alongside families that build orb webs.
    sources: [blackledge2009, fernandez2018]
  - id: derived
    text: Cobweb architecture is interpreted as derived from orb-weaving ancestry.
    confidence: supported
    sources: [blackledge2009, opell2024]
  - id: gumfoot-trap
    text: The gumfoot catches walking prey with a localized adhesive and a releasing ground anchor.
    sources: [opell2024]
  - id: toolkit
    text: Widow glue comes from aggregate glands shared with other araneoids.
    confidence: supported
    sources: [ayoub2021]
  - id: softer-glue
    text: As cobwebs evolved, glue-droplet proteins became softer and less tough than orb-web glue proteins.
    confidence: supported
    sources: [opell2024]
  - id: kept-salts
    text: Widow glue still keeps both glycoproteins and hygroscopic salts, like its orb-weaving relatives.
    sources: [jain2015]
  - id: juvenile
    text: Young widow webs can have central discs and more orderly radial lines than adult webs.
    confidence: supported
    sources: [barrantes2010]
  - id: homology
    text: That juvenile order hints at shared architecture with orbs — without being an orb.
    confidence: supported
    sources: [barrantes2010]
  - id: open-question
    text: How many times orb webs arose or were lost across spiders still depends on the tree and the coding.
    confidence: debated
    sources: [fernandez2018, coddington2019]
