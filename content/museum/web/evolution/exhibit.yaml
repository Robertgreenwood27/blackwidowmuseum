id: web.evolution
accession: BWM-03.11
title: From Orb to Cobweb
kicker: The tangle came after the wheel
summary: Widows belong to the same superfamily as the orb weavers. The cobweb is not a primitive draft of the orb — it is what orb-weaving ancestors' descendants turned into.
status: open
order: 11
taxa: [Latrodectus geometricus, Latrodectus mirabilis]
