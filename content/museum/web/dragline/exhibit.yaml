id: web.dragline
accession: BWM-03.06
title: The Safety Line
kicker: Strong, stretchy, and very hard to break
summary: Dragline silk carries her weight, frames her web and catches her if she falls. It is not stronger than Kevlar — its trick is stretching a third of its length before it fails.
status: open
order: 6
taxa: [Latrodectus hesperus]
