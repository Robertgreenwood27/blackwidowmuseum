    label: Kevlar 49, for scale
    note: stronger than silk — but toughness ≈50 MJ/m³
    sources: [gosline1999]
observations:
  - id: lifeline
    text: Major ampullate silk supplies the widow's lifelines and the structural threads of her web.
    sources: [blackledge2005]
  - id: orb-parity
    text: Western widow dragline performs about as well as published orb-weaver draglines.
    confidence: supported
    sources: [blackledge2005]
  - id: toughness
    text: Because it stretches so far, silk can absorb more energy than materials of higher tensile strength.
    sources: [gosline1999]
  - id: not-just-two
    text: MaSp1 and MaSp2 dominate the fibre, but proteomics found AcSp1 and several small proteins too.
    confidence: supported
    sources: [ayoub2007, larracas2016]
  - id: supercontraction
    text: Wetted silk shortens if it is free; if held, it pulls tight instead.
    sources: [boutry2010]
  - id: reference-state
    text: Wetting and then drying puts widow dragline into a fully supercontracted reference state used to compare silks.
    confidence: supported
    sources: [madurga2016]
  - id: widespread
    text: Supercontraction varies among spider lineages and is not restricted to orb weavers.
    confidence: supported
    sources: [boutry2010]
terms:
  - { term: engineering strain, def: how much a fibre lengthened, divided by its starting length }
  - { term: toughness, def: the energy needed to break a material, per unit volume }
  - { term: supercontraction, def: water-triggered shrinking of silk, or tension if it cannot shrink }
  - { term: major ampullate, def: the gland that makes dragline silk }
