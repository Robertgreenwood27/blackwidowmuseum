    label: stretch before breaking
    note: same fibres; engineering strain
    featured: true
    sources: [blackledge2005]
  - value: "194 ± 58"
    unit: MJ/m³
    label: toughness
    note: energy absorbed per volume before breaking
    sources: [blackledge2005]
