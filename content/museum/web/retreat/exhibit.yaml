id: web.retreat
accession: BWM-03.05
title: The Retreat
kicker: Where she waits
summary: Every widow web has a back room — a silk-lined crevice or a debris-covered cone where she hides by day and carries her catch to eat.
status: open
order: 5
taxa: [Latrodectus hesperus, Latrodectus geometricus, Latrodectus hasselti, Latrodectus revivensis]
