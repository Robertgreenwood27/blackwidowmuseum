observations:
  - id: crevices
    text: Western widow hunting sheets commonly spread out from retreats in crevices.
    confidence: supported
    sources: [zevenbergen2008]
  - id: silk-lined
    text: Brown widows build silk-lined retreats at the edge of the web.
    sources: [benjamin2003]
  - id: cones
    text: Desert widows may live in exposed silk cones covered with debris instead of hidden holes.
    sources: [konigswald1990]
  - id: accumulates
    text: L. revivensis adds debris and dense silk to its nest over successive nights.
    confidence: supported
    sources: [lubin1991]
  - id: shrikes
    text: In captive trials, debris-covered nests kept shrikes from reaching the prey inside.
    confidence: supported
    sources: [konigswald1990]
  - id: dining-room
    text: Redbacks cut wrapped prey free and carry it back to the retreat to feed.
    confidence: supported
    sources: [forster1995]
  - id: larder
    text: A captive redback left the remains of its meals piled around its hiding place.
    confidence: supported
    sources: [vanhelsdingen2019]
  - id: young
    text: The earliest L. mirabilis nymph webs had no side retreat, only a central resting spot.
    confidence: supported
    sources: [barrantes2010]
terms:
  - { term: retreat, def: a protected resting place connected to the capture web }
  - { term: crypsis, def: concealment that makes an animal harder to detect }
