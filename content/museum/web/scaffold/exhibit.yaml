id: web.scaffold
accession: BWM-03.02
title: The Scaffold
kicker: Architecture above the trap
summary: Above the gumfoot lines hangs a tangle of dry, load-bearing silk. It holds the trap up, stores the spring energy that hoists prey, and can thicken into a fortress.
status: open
order: 2
taxa: [Latrodectus hesperus]
