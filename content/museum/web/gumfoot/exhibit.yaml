id: web.gumfoot
accession: BWM-03.01
title: The Gumfoot
kicker: A spring-loaded trap
summary: Taut lines run from the scaffold to the ground, beaded with glue at the foot. Prey walks into one, the weak anchor lets go, and energy stored in the stretched web hoists the prey into the air.
