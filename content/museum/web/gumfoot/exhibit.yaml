observations:
  - id: architecture
    text: Black widow cobwebs combine supporting scaffold threads with sticky gumfoot lines descending to the ground.
    sources: [blackledge2005]
  - id: coupling
    text: Each gumfoot line couples the suspended web to a surface that prey walk across.
    sources: [blackledge2005b]
  - id: capture
    text: Glue near the base catches walking prey; when the weak anchor releases, the taut line springs upward and lifts it.
    sources: [sahni2012, blackledge2005]
  - id: scaffold-energy
    text: In western widow experiments the lifting energy came from recoverable stretching of the scaffold, while gumfoot threads deformed plastically.
    confidence: supported
    sources: [argintean2006]
  - id: same-silk
    text: Dry scaffold and dry gumfoot fibres are mechanically similar — the glue is what makes the foot different.
    sources: [blackledge2005]
  - id: softer-foot
    text: Glue-coated portions of a gumfoot are less stiff and more extensible than the dry line above.
    confidence: supported
    sources: [blackledge2005b]
  - id: load
    text: Whether a line releases, and how far it lifts, depends on the disturbance and on the weight of the prey.
    confidence: supported
    sources: [sahni2012, argintean2006]
  - id: development
    text: Gumfoot number and arrangement change as a widow grows; first-instar L. mirabilis webs had a median of 20.
    confidence: supported
    sources: [barrantes2010]
terms:
