observations:
  - id: aggregate
    text: Gumfoot glue is supplied by the aggregate glands.
    sources: [sahni2011]
  - id: composition
    text: Western widow gumfoot glue contains water-insoluble glycoproteins and hygroscopic organic salts.
    sources: [jain2015]
  - id: salts-matter
    text: The salts still contribute to adhesion, even though widow glue changes less with humidity than orb glues tested.
    confidence: supported
    sources: [jain2015]
  - id: humidity
    text: Its adhesion and elasticity stayed largely unchanged across the humidities tested — unlike orb-web glue.
    sources: [sahni2011]
  - id: liquid
    text: Gumfoot glue behaved as a viscoelastic liquid; the orb-web glue tested behaved as a viscoelastic solid.
    sources: [sahni2011]
  - id: proteomics
    text: Proteomics found aggregate spidroins and further protein families in western widow gumfoot material.
    confidence: supported
    sources: [ayoub2021]
  - id: agsf2
    text: AgSF2 was abundant in widow gumfoot samples and is a different protein from AgSp2.
    confidence: supported
    sources: [ayoub2021]
  - id: diet
    text: Protein-deprived western widows made stickier capture threads, without bigger droplets.
    confidence: supported
    sources: [blamires2014]
  - id: diet-mechanism
    text: The chemistry behind that diet effect has been proposed but not directly identified.
    confidence: debated
    sources: [blamires2014]
  - id: tips
    text: Glue-coated gumfoot tips are less stiff and more extensible than the dry silk above them.
    sources: [blackledge2005, blackledge2005b]
