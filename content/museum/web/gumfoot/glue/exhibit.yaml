id: web.gumfoot.glue
accession: BWM-03.01.02
title: The Glue at the Foot
kicker: A liquid that does not care about the weather
summary: The beads at the foot of each line are a mix of glycoproteins and water-hungry salts. Unlike orb-web glue, they hardly change between dry air and damp.
status: open
order: 2
taxa: [Latrodectus hesperus]
