id: senses.hearing
accession: BWM-04.11
title: Hearing Without Ears
kicker: Air-particle motion can carry sound
summary: Spiders have no eardrums, yet a jumping spider was shown to hear sound from metres away — through hairs on its legs. Whether widows can do the same has never been tested.
status: open
