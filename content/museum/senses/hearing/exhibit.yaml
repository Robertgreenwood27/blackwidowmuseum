observations:
  - id: freeze
    text: An 80 Hz airborne tone made jumping spiders freeze.
    confidence: supported
    sources: [shamble2016]
  - id: neurons
    text: Neurons recorded in the jumping spider brain fired to airborne tones.
    confidence: supported
    sources: [shamble2016]
  - id: isolated
    text: The responses persisted with the spider isolated from vibration, in a chamber without echoes.
    confidence: supported
    sources: [shamble2016]
  - id: hairs
    text: Some of the same neurons also fired when leg hairs were touched directly.
    confidence: supported
    sources: [shamble2016]
  - id: particle
    text: The authors conclude the hairs detect the back-and-forth motion of air particles, not pressure.
    confidence: supported
    sources: [shamble2016]
  - id: no-eardrum
    text: None of this requires a pressure-sensitive eardrum.
    confidence: supported
    sources: [shamble2016]
  - id: far
    text: Air-particle motion persists well beyond the region close to the source.
    sources: [shamble2016]
  - id: flies
    text: Airflow-hair neurons in Cupiennius also encode the air movements of a passing fly.
    confidence: supported
    sources: [barth1999]
