id: senses.trichobothria
accession: BWM-04.01
title: Trichobothria
kicker: A passing insect moves the air before it touches silk
summary: Long, extremely fine hairs set in cup-shaped sockets swing at the faintest movement of air. A brown widow carries dozens of them on its legs; how such hairs work comes mostly from experiments on another spider.
status: open
