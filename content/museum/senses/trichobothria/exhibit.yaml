observations:
  - id: what
    text: Trichobothria are long, very fine hairs set in cup-shaped sockets that sense air movement.
    sources: [barth2004]
  - id: rows
    text: On the brown widow's tibiae, the trichobothria stand in two roughly parallel rows.
    confidence: supported
    sources: [parra2009]
  - id: metatarsal
    text: Brown widows also carry a single trichobothrium near the end of the metatarsus on all but the hindmost legs.
    confidence: supported
    sources: [parra2009]
  - id: compliant
    text: A trichobothrium is anchored far more loosely than an ordinary touch hair, so moving air can swing it.
    sources: [barth2004]
  - id: tuning
    text: What a hair responds to depends on its length and on the slow layer of air hugging the leg — there is no single universal frequency band.
    sources: [barth2004]
  - id: same-cells
    text: In Cupiennius, the sensory cells beneath hairs of different lengths were tuned much alike when driven directly; the hair itself does the filtering.
    confidence: supported
    sources: [barth1999]
  - id: change
    text: Those cells answer change in the airflow rather than firing steadily at rest.
    confidence: supported
    sources: [barth1999]
  - id: wake
    text: An approaching blowfly pushes a smooth bow wave ahead of it, then a turbulent wake.
    confidence: supported
    sources: [klopsch2012]
  - id: jump
    text: Cupiennius launched its prey-capture jump as the fly's wake reached the hairs on its legs.
    confidence: supported
    sources: [klopsch2012]
  - id: evidence
    text: The functional evidence comes from other spiders, chiefly Cupiennius. No widow airflow threshold has been measured.
    confidence: supported
    sources: [barth2004, barth1999]
terms:
