observations:
  - id: transmit
    text: Western widow webs carry the vibrations of male courtship to the female.
    sources: [sivalinghem2021]
  - id: three
    text: Tremulation, bouncing and plucking are each produced by a different movement.
    confidence: supported
    sources: [sivalinghem2021]
  - id: size
    text: The power of a male's bounces and plucks rose with his body size.
    confidence: supported
    sources: [sivalinghem2021]
  - id: efficient
    text: Measured transfer functions showed male-made signals travelling efficiently through the web.
    confidence: supported
    sources: [sivalinghem2021]
  - id: sweeps
    text: Researchers drove widow webs with frequency sweeps and recorded what arrived at several points.
    sources: [vibert2016]
  - id: within
    text: Transmission varied more from point to point within one web than between different webs.
    confidence: supported
    sources: [vibert2016]
  - id: direction
    text: Vibrations along a thread and across it were transmitted about equally well.
    confidence: supported
    sources: [vibert2016]
  - id: no-frequency-code
    text: Because the web passes frequencies so inconsistently, a widow probably cannot identify a caller by frequency alone.
    confidence: supported
    sources: [vibert2016]
  - id: alarm
    text: Prey struggles travel through the cobweb to wherever the resident is waiting.
    sources: [vibert2014]
  - id: receivers
    text: The receivers are the slit organs of her legs, especially the metatarsal lyriform organ above each foot.
    sources: [barth2004]
terms:
