id: senses.vibration
accession: BWM-04.03
title: Reading the Web
kicker: Silk carries motion to the waiting spider
summary: A widow's web is a mechanical transmission network. It carries the struggles of prey and the signals of courting males to her legs — but it is not a wire that passes every frequency equally.
status: open
order: 3
taxa: [Latrodectus hesperus]
figures:
  - value: 3
    label: kinds of male vibration
    note: abdominal tremulation, bounce, web pluck
    featured: true
    sources: [sivalinghem2021]
  - value: "40"
    unit: min
