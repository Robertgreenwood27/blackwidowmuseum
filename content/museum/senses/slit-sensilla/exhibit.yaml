observations:
  - id: slits
    text: Slit sensilla detect tiny strains in the exoskeleton caused by movement and vibration.
    sources: [barth2004]
  - id: lyriform
    text: Lyriform organs are groups of slit sensilla lying side by side — not a separate kind of receptor.
    sources: [barth2004]
  - id: mapped
    text: Brown widow lyriform organs have been mapped on several segments of every leg.
    confidence: supported
    sources: [parra2009]
  - id: dorsal
    text: The brown widow map includes an organ on the top of the joint between metatarsus and tarsus.
    confidence: supported
    sources: [parra2009]
  - id: metatarsal
    text: The metatarsal lyriform organ on the legs is a well-studied detector of substrate vibration.
    sources: [barth2004]
  - id: across
    text: A slit is squeezed most easily by forces acting across its long axis.
    sources: [politi2021]
  - id: graded
    text: Neighbouring slits in one organ differ in sensitivity, so together they cover a wide range of strains.
    confidence: supported
    sources: [schaber2012]
  - id: pad
    text: In Cupiennius, a soft cuticular pad beside the vibration organ filters what reaches it and stops it being over-compressed.
    confidence: supported
    sources: [politi2021]
  - id: high-pass
    text: Cupiennius metatarsal slits grow sharply more sensitive above roughly 40 Hz — a built-in high-pass filter.
    confidence: supported
    sources: [barth1982]
  - id: double-duty
    text: The same metatarsal organ also responds to slow bending of the tarsus, so it reports posture as well as vibration.
    confidence: supported
    sources: [barth1982]
  - id: not-cracks
    text: A slit is not an open crack. A thin membrane covers it, and a sensory dendrite attaches beneath.
    sources: [politi2021]
terms:
  - { term: slit sensillum, def: a strain sensor embedded in the cuticle }
  - { term: lyriform organ, def: a group of closely set slits; named for its resemblance to a lyre }
  - { term: high-pass filter, def: a system that passes higher frequencies better than lower ones }
