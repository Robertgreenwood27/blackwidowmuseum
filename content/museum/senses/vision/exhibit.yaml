id: senses.vision
accession: BWM-04.04
title: Vision
kicker: Limited detail does not mean no light
summary: A widow hunts by the silk under her feet, but her eight eyes still bring her light. Their anatomy is known; what she can actually see — colour, acuity, sensitivity — has never been measured.
status: open
order: 4
taxa: [Latrodectus occidentalis, Latrodectus hasselti, Parasteatoda tepidariorum]
