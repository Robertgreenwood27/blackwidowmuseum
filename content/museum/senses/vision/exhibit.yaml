observations:
  - id: rows
    text: Theridiid spiders, widows included, carry their eight eyes in two rows.
    sources: [jocque2006]
  - id: principal
    text: The anterior median pair are the principal eyes.
    sources: [morehouse2017]
  - id: secondary
    text: The anterior lateral, posterior median and posterior lateral pairs are secondary eyes.
    sources: [morehouse2017]
  - id: retina
    text: Principal and secondary eyes differ in how their retinas face the light.
    sources: [morehouse2017]
  - id: tapetum
    text: Principal eyes lack a tapetum; in many spider groups the secondary eyes have one.
    sources: [morehouse2017]
  - id: canoe
    text: In the house spider, a fellow theridiid, the secondary eyes grow canoe-shaped tapeta split down the middle.
    sources: [gainett2020]
  - id: one-gene
    text: Silencing the gene sine oculis A disrupted both principal and secondary eyes in house spider offspring.
    confidence: supported
    sources: [gainett2020]
  - id: toward-light
    text: Young redbacks climb toward light before they disperse.
    confidence: supported
    sources: [forster1995]
  - id: fades
    text: That pull toward light weakens in older redback stages.
    confidence: supported
    sources: [forster1995]
  - id: led
    text: House spiders moved toward white LED light in laboratory assays.
    confidence: supported
    sources: [kamano2022]
  - id: web-first
    text: Western black widows locate prey mainly through vibrations in the web.
    confidence: supported
    sources: [sergi2021]
  - id: unknown
    text: No widow colour vision, acuity or light threshold has yet been measured; claims of UV vision or red-blindness are borrowed from other spiders.
    confidence: supported
    sources: [morehouse2017]
