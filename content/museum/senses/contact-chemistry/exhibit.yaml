id: senses.contact-chemistry
accession: BWM-04.05
title: Tasting a Thread
kicker: A chemical message begins at a hair's open tip
summary: A male widow can read a female's silk by touch alone — courting on an empty web, or on a scrap of paper soaked in its extract. Curved hairs with open tips on his feet and palps are the likely tasters.
status: open
