observations:
  - id: hairs
    text: Western widows carry curved hairs with blunt, open tips — the presumed taste hairs.
    confidence: supported
    sources: [ross1979]
  - id: where
    text: They sit on the tarsi and on the underside of the pedipalps, in both sexes.
    confidence: supported
    sources: [ross1979]
  - id: empty-web
    text: Male western widows courted on webs whose female had been removed.
    confidence: supported
    sources: [ross1979]
  - id: extract
    text: A solvent extract of female silk was enough to make males court on filter paper.
    confidence: supported
    sources: [scott2015b]
  - id: pheromone
    text: Female western widow silk carries an identified serine methyl ester that stimulates male courtship.
    sources: [scott2015b]
  - id: weaker
    text: That one synthetic compound alone drew weaker responses than real silk or extract.
    confidence: supported
    sources: [scott2015b]
  - id: blend
    text: A two-component synthetic blend later triggered full courtship.
    confidence: supported
    sources: [fischer2025]
  - id: virgin
    text: Male redbacks told virgin-female web extracts apart from those of juvenile females.
    confidence: supported
    sources: [stoltz2007]
  - id: mated
    text: Extracts from webs spun just after a redback mated were no more interesting to males than plain solvent.
    confidence: supported
    sources: [stoltz2007]
  - id: dual-cells
    text: In Argiope, a single tip-pore hair holds both taste cells and touch cells.
    sources: [muller2020]
  - id: dendrites
    text: Their taste dendrites run the length of the hair to the pore at its tip.
    sources: [muller2020]
  - id: presumed
    text: No one has yet recorded a widow taste hair firing to a purified pheromone; the link is anatomical.
    confidence: supported
    sources: [ross1979]
terms:
  - { term: contact chemoreception, def: detecting chemicals by touching them — taste, in effect }
  - { term: tip-pore sensillum, def: a sensory hair with a single opening at its tip }
  - { term: contact pheromone, def: a chemical signal detected by touching it }
