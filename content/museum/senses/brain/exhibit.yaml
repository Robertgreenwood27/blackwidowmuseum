observations:
  - id: synganglion
    text: A spider's central nervous system is fused into one mass, the synganglion, in the front body.
    sources: [artiushin2024]
  - id: above-below
    text: Its main divisions lie above and below the oesophagus.
    sources: [artiushin2024]
  - id: rind
    text: Nerve cell bodies form a rind around a core of tangled fibres and synapses.
    confidence: supported
    sources: [artiushin2024]
  - id: principal-path
    text: In the house spider, signals from the principal eyes pass through two processing stages in series.
    sources: [steinhoff2024]
  - id: secondary-path
    text: All three pairs of secondary eyes on each side share a single first processing stage.
    sources: [steinhoff2024]
  - id: no-second
    text: No separate second stage for the secondary eyes was found.
    confidence: supported
    sources: [steinhoff2024]
  - id: mushroom
    text: No distinct mushroom body was identified either, though a reduced circuit may remain.
    confidence: supported
    sources: [steinhoff2024]
  - id: legs-win
    text: Web-builders devoted proportionally more nerve tissue to their legs than the hunting spiders compared.
    confidence: supported
    sources: [steinhoff2024]
  - id: not-widow
    text: These are house spider measurements; no widow brain has been mapped this way.
    confidence: supported
    sources: [steinhoff2024]
