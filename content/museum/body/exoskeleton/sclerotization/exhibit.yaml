id: body.exoskeleton.sclerotization
accession: BWM-01.07.04
title: Tanning the Armour
kicker: Hardness and blackness need separate evidence
summary: Cuticle hardens when its proteins become cross-linked. It darkens when pigment is laid down. These are different processes. The best-tested hardening chemistry comes from insects, and for widows we know about the pigment, not yet the precise hardening pathway.
status: open
order: 4
