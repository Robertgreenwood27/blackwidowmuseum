id: body.exoskeleton.soft-after-molt
accession: BWM-01.07.10
title: The Soft Hours
kicker: Escape is one event; hardening is another
summary: A freshly molted widow is pale and pliable. Body-fluid pressure inflates the new cuticle to its larger size before it stiffens. Water leaves it, inner layers keep being added, and specialised parts such as the fangs go on maturing chemically. Nobody has timed this for a widow.
