id: body.exoskeleton.hairs
accession: BWM-01.07.06
title: A Coat of Sensors
kicker: The socket is part of the instrument
summary: A widow's hairs are not fur; they are cuticle shaped into instruments. A touch hair pivots in a flexible socket. A trichobothrium is fine enough to swing in a breath of air. A taste hair opens at its tip, and the comb on the fourth leg is a row of serrated bristles for throwing silk.
