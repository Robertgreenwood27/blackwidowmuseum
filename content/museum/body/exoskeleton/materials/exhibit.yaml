id: body.exoskeleton.materials
accession: BWM-01.07.12
title: A Material Toolbox
kicker: Architecture, water and chemistry tune one material
summary: From one basic recipe of chitin, protein and water, spiders make soft joint pads, tough claws and metal-hardened fangs. They do it by changing fibre direction, water content and local chemistry. All the measurements so far come from other spiders, and none gives a single stiffness for a widow's body wall.
