id: body.exoskeleton.apodemes-and-attachment
accession: BWM-01.07.08
title: Muscles on the Inside
kicker: Pulling on a shell from within
summary: An exoskeleton has its muscles inside. They pull on the shell through tendon cells, inward folds of cuticle and long cuticular tendons. The prosoma also holds the endosternite, an internal plate of connective tissue that anchors muscles without being part of the shell. A 1959 survey counted over five hundred muscles in a widow.
