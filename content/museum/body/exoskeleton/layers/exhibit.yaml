id: body.exoskeleton.layers
accession: BWM-01.07.01
title: Built in Layers
kicker: A surface, a laminate, a living maker
summary: Cut through a widow's cuticle and you meet a thin waxy epicuticle, then the chitin-rich exocuticle and endocuticle, and finally the living epidermis that made them all. Inside the chitin layers, fibres are laid down in sheets whose direction slowly rotates, like a spiral staircase of plywood.
