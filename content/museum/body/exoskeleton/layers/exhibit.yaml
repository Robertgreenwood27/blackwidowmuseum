    text: Hadley examined western widow cuticle from the cephalothorax, abdomen and walking legs under the electron microscope.
    confidence: supported
    sources: [hadley1981]
  - id: sublayers
    text: In the walking legs the epicuticle splits into an outer membrane, an outer epicuticle and a dense homogeneous layer.
    confidence: supported
    sources: [hadley1981]
  - id: no-cuticulin
    text: No cuticulin layer, a feature of many insect cuticles, was seen in those preparations.
    confidence: supported
    sources: [hadley1981]
  - id: procuticle
    text: Beneath the fibreless epicuticle lies the procuticle, built of chitin–protein fibres.
    sources: [tadayon2020]
  - id: helicoid
    text: Fibre direction rotates from sheet to sheet through the laminate.
    sources: [barth1973]
  - id: epidermis
