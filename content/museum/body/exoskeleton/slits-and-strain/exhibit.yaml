id: body.exoskeleton.slits-and-strain
accession: BWM-01.07.07
title: Reading Its Own Strain
kicker: Deliberate soft spots in a stiff shell
summary: Scattered over the legs are tiny slits in the cuticle, each covered by a thin membrane. When the shell flexes, the slits squeeze and a nerve fires. These are strain gauges built into the armour. Brown widows carry 88 groups of them on their walking legs.
