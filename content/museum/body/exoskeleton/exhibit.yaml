id: body.exoskeleton
accession: BWM-01.07
title: The Exoskeleton
kicker: One covering, many material jobs
summary: The widow's skeleton is on the outside, a layered composite of chitin and protein. It is a stiff shell over the legs and carapace, pliable membrane at the joints and abdomen, a waxed barrier against drying out, and a surface studded with sensors. Twelve halls follow how it is built, sealed, shed and mended.
