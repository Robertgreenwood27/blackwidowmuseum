observations:
  - id: composite
    text: Spider cuticle is built from chitin microfibres embedded in a protein matrix.
    sources: [foelix2011, politi2021]
  - id: barrier
    text: Surface lipids make the western widow's cuticle a far better barrier to water loss.
    confidence: supported
    sources: [hadley1989]
  - id: canals
    text: Pore and wax canals run through widow cuticle, connecting the living epidermis to the surface.
    confidence: supported
    sources: [hadley1981]
  - id: regions
    text: Different regions of the cuticle do different mechanical jobs — stiff plates, pliable membranes, sensory openings.
    sources: [politi2021]
  - id: soft-abdomen
    text: The abdominal cuticle is pliable, letting the abdomen expand with food and eggs while the prosoma and legs stay rigidly encased.
    sources: [foelix2011, australianmuseum2018]
  - id: gloss
    text: Adult female western black widows are characteristically shiny black.
    sources: [vetter2017]
  - id: setae
    text: The cuticle bears socketed hairs that act as touch sensors when bent.
    sources: [barth2004]
  - id: matures
    text: New cuticle goes on maturing and stiffening after the spider has climbed out of the old one.
    sources: [politi2021]
  - id: repair
    text: Sealing a wound is not the same as replacing a lost part; widow experiments show both outcomes.
    confidence: supported
    sources: [randall1981, randall1982]
