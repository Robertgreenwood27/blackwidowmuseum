id: body.exoskeleton
accession: BWM-01.07
title: The Exoskeleton
kicker: Armour that must be shed
summary: The widow's skeleton is on the outside — a layered composite of chitin and protein, rigid over the legs and carapace, soft enough on the abdomen to swell after a meal.
status: open
order: 5
taxa: [Latrodectus hesperus]
