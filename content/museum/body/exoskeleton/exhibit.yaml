observations:
  - id: composite
    text: Spider cuticle is built from chitin microfibres embedded in a protein matrix.
    sources: [foelix2011]
  - id: barrier
    text: The thin outer epicuticle largely controls how much water passes through the cuticle.
    sources: [foelix2011]
  - id: sclerotization
    text: After each molt, the new exocuticle hardens through sclerotization.
    sources: [foelix2011]
  - id: soft-abdomen
    text: The abdominal cuticle is comparatively soft, letting it expand between molts while the prosoma and legs stay rigidly encased.
    sources: [foelix2011]
  - id: lipids
    text: The western widow's carapace surface carries lipid droplets and a film that obscure its finer detail.
    confidence: supported
    sources: [hadley1981]
  - id: canals
    text: Pore and wax canals run through widow cuticle, connecting the living epidermis to the surface.
    confidence: supported
    sources: [hadley1981]
  - id: gloss
    text: Adult female western black widows are characteristically shiny black.
    sources: [vetter2017]
  - id: setae
    text: The cuticle bears socketed hairs that act as touch sensors when bent.
    sources: [barth2004]
terms:
