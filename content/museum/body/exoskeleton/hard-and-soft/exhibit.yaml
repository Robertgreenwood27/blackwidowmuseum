id: body.exoskeleton.hard-and-soft
accession: BWM-01.07.03
title: Plates and Membranes
kicker: Stiffness changes from place to place
summary: A shell that must move needs soft seams. Stiff plates armour the prosoma and legs, and pliable membranes join them at every joint. The abdomen is mostly pliable cuticle that stretches with each meal and every clutch of eggs. It is still cuticle, though, and carries hard plates of its own.
