title: Wounds and Mends
kicker: Close the breach, then rebuild beneath it
summary: The cuticle is not alive and cannot heal itself. When it is punctured, blood cells plug the hole, the epidermis regrows underneath and secretes new cuticle. Replacing a lost leg is a different matter. In northern widows it depends on where the leg was lost.
