id: body.exoskeleton.molting-mechanics
accession: BWM-01.07.09
title: Getting Out
kicker: Make the replacement before opening the old shell
summary: A molt begins hidden beneath the old cuticle. The epidermis pulls away and starts building a new covering underneath. Then the widow hangs from her silk, the old shell splits along her sides, and she pulls herself out, legs last.
status: open
