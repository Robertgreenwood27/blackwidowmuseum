id: body.exoskeleton.waterproofing
accession: BWM-01.07.02
title: The Waxed Shield
kicker: A thin barrier with a large effect
summary: A film of surface lipids holds water in. When researchers scrubbed it from western widows with solvent, the spiders lost water about two hundred times faster. Heat weakens the barrier too, most steeply between 45 and 51 °C.
status: open
order: 2
