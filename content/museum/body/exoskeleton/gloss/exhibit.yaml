id: body.exoskeleton.gloss
accession: BWM-01.07.05
title: The Shine
kicker: A bright reflection on a dark animal
summary: An adult female widow is black and glossy, but those are two separate properties. Black is about how much light is absorbed; gloss is about how the remaining light bounces off. The pigment has been studied. The shine has never been measured.
