  - id: fused
    text: The brain joins a fused mass of ganglia below the oesophagus.
    sources: [snodgrass1952]
  - id: gullet
    text: The oesophagus passes through the middle of the nerve mass on its way to the sucking stomach.
    sources: [snodgrass1952]
  - id: leg-nerves
    text: Nerves run from the lower ganglionic mass out into each walking leg.
