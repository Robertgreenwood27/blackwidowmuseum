terms:
  - term: ommochromes
    def: pigments built from tryptophan, including ommatins and ommins
  - term: Raman shift
    def: the energy change of scattered laser light, in cm⁻¹ — not a wavelength in nm
  - term: eumelanin
    def: a dark melanin that absorbs broadly
  - term: guanine reflector
    def: crystals that scatter light to make white, rather than absorbing colours
  - term: hypodermis
    def: the layer of cells beneath the cuticle
  - term: structural colour
    def: colour produced by physical structure rather than pigment
