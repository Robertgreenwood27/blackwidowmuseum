id: body.hourglass.inverted
accession: BWM-01.01.03
title: The Side Facing the Sky
kicker: Underside need not mean hidden
summary: The hourglass is on the anatomical underside, but a widow hangs upside down, so that underside faces up. The shape of the web, its height and the retreat decide which surfaces are exposed; a stripe on the back is a separate mark.
