  - id: gumfoot
    text: Western widow cobwebs include gumfoot lines that run down to the ground below.
    sources:
      - blackledge2005b
  - id: ground-prey
    text: Gumfoot lines catch prey walking across the ground and carry its struggles up to the spider.
