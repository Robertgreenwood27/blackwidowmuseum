id: body.hourglass.receivers
accession: BWM-01.01.02
title: Red Through Other Eyes
kicker: A colour belongs to its viewer
summary: A spectrometer records the light the hourglass returns; a visual model estimates how a given eye would receive it. To a bird the mark stands out sharply from the black. To an insect it barely does.
status: open
order: 2
