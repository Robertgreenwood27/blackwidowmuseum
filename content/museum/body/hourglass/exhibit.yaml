observations:
  - id: ventral
    text: Adult female southern and western black widows usually bear a red hourglass beneath the abdomen.
    sources: [kaston1970]
  - id: southern-connection
    text: In female L. mactans, the two halves of the hourglass usually join at the narrow middle.
    sources: [carlton2021]
  - id: split
    text: The northern black widow, L. variolus, often has two separated red marks instead of a joined hourglass, sometimes greatly reduced.
    sources: [kaston1970, vetter2017, carlton2021]
  - id: variable
    text: Western widows can show joined triangles, separated marks, very little red, or occasionally no visible hourglass.
    sources: [vetter2017]
  - id: brown-orange
    text: The brown widow, L. geometricus, typically wears an orange rather than a red hourglass.
    sources: [hannum2010]
  - id: redback-two-surfaces
    text: The Australian redback, L. hasselti, pairs a ventral hourglass with a separate orange-red stripe along the top of the abdomen.
    sources: [australianmuseum2026]
  - id: inverted
    text: Black widows commonly wait upside down in their webs, so the hourglass faces upward and outward.
    sources: [vetter2017]
  - id: bird-deterrence
    text: In a choice experiment, wild birds attacked black widow models bearing a red mark less often than all-black models.
    confidence: supported
    sources: [brandley2016]
  - id: receiver-dependent
    text: Visual models predict the red-on-black contrast is more conspicuous to birds than to the insects widows eat.
    confidence: supported
    sources: [brandley2016]
  - id: precursor
    text: First-instar western widows already carry a pale yellow patch beneath the abdomen, the forerunner of the hourglass.
    sources: [kaston1970]
  - id: males-too
    text: The mark is not only female; adult male redbacks can carry a pale hourglass on the underside.
    sources: [australianmuseum2026]
  - id: pigment
    text: Raman spectra of the western widow's hourglass have been tentatively assigned to ommochrome pigments.
    confidence: supported
    sources: [hsiung2017]
terms:
