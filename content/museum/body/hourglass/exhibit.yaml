id: body.hourglass
accession: BWM-01.01
title: The Hourglass
kicker: A signal worn upside down
summary: The red mark sits on the underside of the abdomen. Because she hangs inverted, the side she shows the world is the warning. Ten halls follow it further, into the eyes that see it, how it grows, what it is made of and where it came from.
status: open
order: 4
taxa: [Latrodectus mactans, Latrodectus hesperus, Latrodectus variolus, Latrodectus hasselti, Latrodectus geometricus]
