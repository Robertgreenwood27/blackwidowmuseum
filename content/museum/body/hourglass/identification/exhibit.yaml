id: body.hourglass.identification
accession: BWM-01.01.10
title: A Clue, Not a Verdict
kicker: Identify the spider around the mark
summary: A red hourglass is a valuable field clue, especially on a familiar adult female. A reliable identification also weighs life stage, geography, the egg sac and anatomy, and a specialist's characters where they are needed.
status: open
order: 10
taxa:
  - Latrodectus hesperus
  - Latrodectus geometricus
  - Latrodectus pallidus
  - Latrodectus occidentalis
  - Latrodectus lucacha
  - Steatoda grossa
