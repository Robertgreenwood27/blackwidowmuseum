observations:
  - id: southern-joined
    text: Female southern widows usually have a connected hourglass.
    sources:
      - carlton2021
  - id: northern-split
    text: Female northern widows often have two separated marks.
    sources:
      - carlton2021
  - id: western-any
    text: Western widow hourglasses can be joined, separated, reduced or occasionally absent.
    sources:
      - vetter2017
  - id: southern-hues
    text: A southern widow's mark can be red, orange or yellowish orange.
    sources:
      - carlton2021
  - id: brown-orange
    text: Brown widow hourglasses are typically orange but can approach red-orange.
    sources:
      - vetter2012c
  - id: brown-body
    text: Brown widow bodies range from very pale to nearly black.
    sources:
      - vetter2017
  - id: red-widow
    text: Red widows have reddish-orange legs and head, with dark abdomens bearing ringed spots on the back.
    sources:
      - floridanaturalareasinventory2023
  - id: red-widow-spots
    text: Instead of a complete hourglass, the red widow has spots on its underside.
    sources:
      - floridanaturalareasinventory2023
  - id: mediterranean
    text: Mediterranean widow material includes both spotted and entirely dark adult females.
    sources:
      - lotz1994
  - id: katipo-cline
    text: Katipō colour changes with geography and correlates with mean annual temperature.
    sources:
      - vink2008
    confidence: supported
  - id: katipo-one
    text: Crossing and molecular evidence showed that the black katipō is the same species as the red katipō.
    sources:
      - vink2008
      - wsc2026
  - id: white-widow
    text: White widows have cream abdomens with dark spots on the back and pale marks underneath.
    sources:
      - lotz1994
  - id: indistinctus
    text: Adults of the African L. indistinctus may have no ventral hourglass at all.
    sources:
      - lotz1994
  - id: occidentalis
    text: Described L. occidentalis females combine red patterns on the back with a complete hourglass underneath.
    sources:
      - valdezmondragon2023
