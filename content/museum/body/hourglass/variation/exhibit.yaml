id: body.hourglass.variation
accession: BWM-01.01.06
title: A Family of Different Marks
kicker: Joined, divided, orange, pale — or gone
summary: A useful field pattern is not a fixed character of the genus. Shape, hue and the body around the mark vary within species as well as between them, and a colour form that changes with geography is not necessarily a separate species.
