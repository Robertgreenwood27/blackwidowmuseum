id: body.epigynum.storage
accession: BWM-01.13.05
title: Sperm Kept Alive
kicker: Storage is a changing cellular state
summary: One mating can supply several broods. Inside the stores, sperm arrive in capsules, and some soon shed them. Some sperm are still encapsulated after several egg sacs have been laid. How long storage can last in a widow still needs a checked number.
status: open
order: 5
taxa: [Latrodectus revivensis, Latrodectus hasselti, Latrodectus geometricus]
