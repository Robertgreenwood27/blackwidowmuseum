observations:
  - id: plate
    text: In adult brown widows, a hardened epigynal plate gives slit-like access to a shared genital chamber.
    confidence: supported
    sources: [sentenska2021]
  - id: two-entrances
    text: Each side of that chamber holds the entrance to its own copulatory duct.
    confidence: supported
    sources: [sentenska2021]
  - id: coiled-ducts
    text: Each copulatory duct coils toward, and around, its spermatheca.
    confidence: supported
    sources: [sentenska2021]
  - id: dumbbell
    text: Brown widow spermathecae are dumbbell-shaped, two lobes joined by a narrow waist.
    confidence: supported
    sources: [sentenska2021]
  - id: fertilization-route
    text: Separate fertilisation ducts lead from the spermathecae toward the uterus, so sperm enters by one route and meets eggs by another.
    confidence: supported
    sources: [sentenska2021]
  - id: storage
    text: A western widow female produced developing offspring after 499 days with no new mating.
    confidence: supported
    sources: [kaston1970]
  - id: yolk
    text: Western widow eggs develop in the ovaries, accumulating lipid and protein yolk as they grow.
    confidence: supported
    sources: [ouriel2016]
  - id: pedicels
    text: Developing eggs are attached to the ovary wall by short stalks.
    confidence: supported
    sources: [ouriel2016]
  - id: sac
    text: The laid egg mass is wrapped in successive layers of silk to form the egg sac.
    sources: [kaston1970]
