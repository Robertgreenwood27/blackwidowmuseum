id: body.epigynum
accession: BWM-01.13
title: The Epigynum
kicker: Paired pathways for sperm, a separate route for eggs
summary: A hardened plate under the female's abdomen leads to two coiled ducts and two sperm stores. Sperm from one mating can last through several egg sacs. Eleven halls follow the female system from the plate inward, through maturation, storage, egg-making and laying, to what males leave behind.
