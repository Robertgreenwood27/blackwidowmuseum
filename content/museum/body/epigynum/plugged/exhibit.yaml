id: body.epigynum.plugged
accession: BWM-01.13.09
title: What the Male Leaves Behind
kicker: Where a tip lodges matters more than how many
summary: Broken embolus tips stay in the female, and some carry several on one side. Dissections of wild white widows show tips piling up and keeping later males out only partly. Whether a female ever removes them has not been shown.
