  - { term: atrium, def: the genital recess that gives access to the copulatory openings }
  - { term: sclerotisation, def: hardening of cuticle — darker is not necessarily harder }
  - { term: entelegyne, def: having separate incoming and outgoing sperm routes }
  - { term: haplogyne, def: using one duct to carry sperm both in and out }
