id: body.epigynum.the-plate
accession: BWM-01.13.01
title: The Plate Under the Abdomen
kicker: A small entrance on the underside
summary: The visible plate is only the outer part of a much larger system. It sits on the underside where the abdomen begins, between the two book-lung slits, and leads into a recess with two separate entrances. Eggs leave by another opening.
status: open
