observations:
  - id: position
    text: In L. revivensis, the hardened genital plate sits immediately in front of the epigastric furrow.
    sources: [berendonck2002]
  - id: shape
    text: The adult L. revivensis plate is arched and transversely oval.
    sources: [berendonck2002]
  - id: aperture
    text: Its atrial aperture is roughly triangular, with hairs overhanging the entrance.
    sources: [berendonck2002]
  - id: slit
    text: Adult brown widows have slit-like access to the atrium.
    sources: [sentenska2021]
  - id: lip
    text: During mating, the brown widow male's bulb braces against the rear lip of the epigynum.
    confidence: supported
    sources: [sentenska2025]
  - id: furrow
    text: The epigastric furrow runs between the paired book-lung openings.
    sources: [zhan2019]
terms:
