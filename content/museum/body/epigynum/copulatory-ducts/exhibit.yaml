id: body.epigynum.copulatory-ducts
accession: BWM-01.13.03
title: The Coiled Path
kicker: Follow the fold, then the return
summary: Behind each entrance a duct coils away and then turns back toward its sperm store. Sections show these are connected spiral folds rather than a loose hose, and the published turn counts for one species disagree.
status: open
