observations:
  - id: turns-back
    text: Each L. revivensis copulatory duct coils away and then turns back toward its spermatheca.
    sources: [berendonck2002]
  - id: guide
    text: Near its end the duct flattens beside a more strongly hardened guide.
    sources: [berendonck2002]
  - id: folds
    text: Brown widow sections show connected spiral folds, not wholly separate tubes.
    sources: [sentenska2021]
  - id: follows
    text: During insertion, the brown widow male's embolus follows the copulatory duct.
    sources: [sentenska2025]
  - id: extra-loop
    text: McCrone and Levi described an extra duct loop in female L. mactans compared with related widows.
    confidence: supported
    sources: [mccrone1964]
  - id: conflict
    text: Two descriptions of the same species give different coil counts, so a single turn count is not a safe identifier.
    confidence: supported
    sources: [berendonck2002, berendonck2005]
