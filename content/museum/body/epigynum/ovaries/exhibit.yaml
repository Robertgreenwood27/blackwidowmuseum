title: Making Eggs
kicker: A growing egg hangs from a stalk
summary: Eggs grow on the wall of the ovary, each on a short stalk, filling with yolk before they detach. Western widows make yolky eggs even without mating. Redbacks show that food, not a fixed clock, sets the pace.
