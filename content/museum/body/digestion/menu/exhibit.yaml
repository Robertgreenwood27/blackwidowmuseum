id: body.digestion.menu
accession: BWM-01.14.05
title: What Counts as Dinner?
kicker: A broad menu can have local favourites
summary: Insects dominate every measured widow diet, but woodlice, other spiders, scorpions and the occasional lizard, snake or mouse broaden the picture. Prey collections tell us what a population eats; a dramatic photograph tells us only that something happened once.
