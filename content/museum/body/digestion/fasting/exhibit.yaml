observations:
  - id: cold
    text: Starved female redbacks survived longest at 10 °C and less long at 25 °C.
    confidence: supported
    sources: [forster1989]
  - id: recovery
    text: Most redbacks deprived for two to three months recovered when fed.
    confidence: supported
    sources: [forster1989]
  - id: shutdown
    text: Starving redbacks lost web-building and then walking ability in succession.
    confidence: supported
    sources: [forster1989]
  - id: sluggish
