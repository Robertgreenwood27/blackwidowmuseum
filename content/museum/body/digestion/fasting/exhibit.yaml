  - id: juvenile-diet
    text: A leaner juvenile diet did not extend an adult male redback's survival.
    confidence: supported
    sources: [kasumovic2009]
  - id: males-eat
    text: Kaston saw adult American widow males still catching and eating prey.
    confidence: supported
