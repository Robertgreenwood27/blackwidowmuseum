id: body.digestion.fasting
accession: BWM-01.14.07
title: Going Without
kicker: Endurance depends on the animal and the conditions
summary: Adult female widows can survive months without food in the laboratory, longer when cool. Survival is not free; activity, web-building and reproduction fall away first, and males run out far sooner.
status: open
order: 7
taxa: [Latrodectus hesperus, Latrodectus hasselti]
