id: body.digestion.water
accession: BWM-01.14.09
title: Water in a Liquid Life
kicker: Keeping water and finding water are different problems
summary: Redbacks have been seen drinking, yet young widows have been reared on prey alone. A waxy layer in the cuticle holds water in so well that stripping it away multiplies water loss about two hundredfold.
status: open
order: 9
taxa: [Latrodectus hesperus, Latrodectus hasselti]
