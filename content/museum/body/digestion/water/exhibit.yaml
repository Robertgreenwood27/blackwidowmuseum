    label: faster water loss with the cuticle's lipids stripped
    note: L. hesperus abdominal cuticle, solvent-treated versus control; an experiment, not natural variation
    featured: true
    sources: [hadley1989]
  - value: "30 °C, 0%"
    unit: RH
    label: conditions of the drying assay
    note: far drier than a normal retreat
    sources: [hadley1989]
observations:
  - id: drinking
    text: Adult male redbacks have been observed drinking water.
    confidence: supported
    sources: [forster1995]
  - id: prey-only
    text: Redback young have been reared on supplied prey with no drinking water provided.
    sources: [downes1987]
  - id: barrier
    text: Removing the cuticle's surface lipids with solvent sharply increased water loss in western widows.
    confidence: supported
    sources: [hadley1989]
  - id: temperature
    text: Cuticular permeability rose with temperature.
    confidence: supported
    sources: [hadley1989]
  - id: preparations
    text: Isolated cuticle lost water faster than the same cuticle left in place on a dead spider.
    confidence: supported
    sources: [hadley1989]
  - id: other-routes
    text: Comparisons of living spiders with patches of cuticle hinted at other water-loss routes, without a significant difference.
    confidence: debated
    sources: [hadley1989]
