id: body.digestion.midgut
accession: BWM-01.14.03
title: The Branching Larder
kicker: Absorption and storage share living tissue
summary: The midgut is not a straight pipe but a branching organ that fills the abdomen and reaches toward the legs. Its cells finish digestion inside themselves and keep reserves of fat and sugar for leaner days.
status: open
order: 3
taxa: [Latrodectus mirabilis]
