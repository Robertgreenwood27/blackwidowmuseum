  - { term: midgut gland, def: the branched digestive tissue, sometimes loosely called a hepatopancreas }
  - { term: digestive vacuole, def: a compartment inside a cell where ingested material is processed }
  - { term: glycogen, def: a storage carbohydrate built from glucose }
  - { term: lipoprotein, def: a lipid–protein particle that carries fat through body fluid }
