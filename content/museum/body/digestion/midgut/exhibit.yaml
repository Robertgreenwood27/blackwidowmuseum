observations:
  - id: toward-legs
    text: Branches of the anterior midgut run toward the bases of the legs.
    sources: [snodgrass1952]
  - id: abdomen
    text: Branched abdominal diverticula occupy much of the upper abdomen.
    sources: [snodgrass1952]
  - id: widow-histology
    text: Normal midgut-diverticulum tissue has been photographed in section from a black widow identified to genus.
    sources: [gaudette2023]
  - id: secretory
    text: Secretory cells release digestive enzymes into the gut lumen.
    sources: [fuzita2016]
  - id: resorptive
    text: Resorptive cells take predigested material into vacuoles and finish breaking it down inside themselves.
    sources: [laino2009]
  - id: storage
    text: Histology showed fat and glycogen stored in spider digestive tissue before tracer studies confirmed it.
    confidence: supported
    sources: [laino2009]
  - id: tracer
    text: In a huntsman spider, labelled fatty acid collected mainly in the midgut diverticula after feeding or injection.
    confidence: supported
    sources: [laino2009]
  - id: synthesis
    text: Those diverticula built several kinds of lipid from the label.
    confidence: supported
    sources: [laino2009]
  - id: carriers
    text: Two high-density lipoproteins have been isolated from the haemolymph of L. mirabilis.
    sources: [cunningham2000]
terms:
