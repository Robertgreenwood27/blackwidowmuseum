id: body.digestion.wastes
accession: BWM-01.14.10
title: What Leaves the Spider
kicker: A prey shell and a dropping tell different stories
summary: Spiders dispose of nitrogen mainly as guanine, collected by Malpighian tubules and stored in a pocket at the end of the gut. Some guanine is never expelled but kept as white crystals. What drops beneath a web goes on to feed the soil.
status: open
order: 10
taxa: [Latrodectus geometricus, Latrodectus mactans, Latrodectus pallidus]
