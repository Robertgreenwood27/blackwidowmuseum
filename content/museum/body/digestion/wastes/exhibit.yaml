observations:
  - id: tubules
    text: Malpighian tubules branch among the abdominal diverticula and open into the end of the gut.
    sources: [snodgrass1952]
  - id: pocket
    text: A short passage connects the enlarged stercoral pocket to the anus.
    sources: [snodgrass1952]
  - id: coxal
    text: A study of southern-widow musculature described muscles serving the coxal glands, a second excretory system.
