id: body.digestion
accession: BWM-01.14
title: Liquid Meals
kicker: Digestion begins outside the body
summary: A widow cannot chew. She floods her prey with digestive fluid, drinks back the result, and can then go many months without eating again.
status: open
order: 12
taxa: [Latrodectus geometricus, Latrodectus hasselti]
figures:
  - value: ">300"
    unit: days
    label: adult survival without food
    note: some female redbacks, laboratory trials
    featured: true
    sources: [forster1989]
  - value: 160
    unit: days
    label: longest subadult survival without food
    note: redback, same study
    sources: [forster1989]
  - value: "4.9–7.4"
    unit: pulses/s
    label: rhythm of drinking
    note: one feeding brown widow, three bouts
    sources: [eberhard2006]
observations:
  - id: regurgitation
    text: Brown widows have been filmed releasing clear fluid onto prey and then taking the fluid back up.
    confidence: supported
    sources: [eberhard2006]
  - id: cycles
    text: Feeding alternates fast regurgitation with slower, pulsing uptake.
    confidence: supported
    sources: [eberhard2006]
  - id: intact-prey
    text: Flies fed on by brown widows stayed largely intact apart from holes at the feeding sites.
    confidence: supported
    sources: [eberhard2006]
  - id: filter
    text: Hairs on the mouthparts and a filter in the pharynx keep solid particles out.
    sources: [eberhard2006]
  - id: pump
    text: A muscular sucking stomach in the prosoma pumps the liquid meal into the gut.
    sources: [snodgrass1952]
  - id: diverticula
    text: Branched pouches of the midgut fill much of the upper abdomen and carry on digestion inside.
    sources: [snodgrass1952]
  - id: excretion
    text: Branched Malpighian tubules remove wastes into the rear of the gut.
    sources: [snodgrass1952]
  - id: cold
    text: Starved female redbacks survived longest at 10 °C and markedly less long at 25 °C.
    confidence: supported
    sources: [forster1989]
  - id: recovery
    text: Most redbacks starved for two to three months recovered once they were fed.
    confidence: supported
    sources: [forster1989]
terms:
  - { term: extra-oral digestion, def: breaking food down outside the mouth and gut }
  - { term: sucking stomach, def: a muscular pump in the foregut }
  - { term: diverticulum, def: a blind-ended branch of the gut }
  - { term: Malpighian tubules, def: branched excretory tubes opening into the gut }
