  - id: cycles
    text: Feeding alternates fast regurgitation with slower, pulsing uptake.
    confidence: supported
    sources: [eberhard2006]
  - id: intact-prey
    text: Flies fed on by brown widows stayed largely intact apart from holes at the feeding sites.
    confidence: supported
    sources: [eberhard2006]
  - id: inside-too
    text: In spiders, digestion begins outside the body but is finished inside cells of the midgut.
    sources: [fuzita2016, laino2009]
  - id: filter
    text: In spiders generally, hairs on the mouthparts and a filter in the pharynx keep solid particles out.
    sources: [foelix2011, dunlop1994]
  - id: pump
    text: In spiders generally, a muscular sucking stomach in the prosoma pumps the liquid meal into the gut.
    sources: [snodgrass1952]
  - id: diverticula
    text: Branched pouches of the midgut fill much of the upper abdomen and carry on digestion inside.
    sources: [snodgrass1952]
  - id: excretion
    text: Branched Malpighian tubules remove wastes into the rear of the gut.
    sources: [snodgrass1952]
  - id: metabolic-brake
    text: Mated redback females reduced their resting CO₂ output while deprived of food.
    confidence: supported
    sources: [stoltz2010b]
  - id: cold
    text: Starved female redbacks survived longest at 10 °C and markedly less long at 25 °C.
    confidence: supported
    sources: [forster1989]
  - id: droppings
    text: Brown-widow droppings carried a prey-derived isotope label onward into a nutrient-transfer experiment.
    confidence: supported
