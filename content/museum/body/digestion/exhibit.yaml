id: body.digestion
accession: BWM-01.14
title: Liquid Meals
kicker: A meal continues after the prey is gone
summary: A widow cannot chew. She wets her prey with digestive fluid, drinks the result back, filters it, pumps it inward, and finishes the work inside a branching gut that doubles as a larder. Twelve halls follow the meal from the prey package to reserves, fasting and wastes.
status: open
order: 12
