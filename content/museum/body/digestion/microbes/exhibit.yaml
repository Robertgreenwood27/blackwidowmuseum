id: body.digestion.microbes
accession: BWM-01.14.11
title: Passengers Inside
kicker: Detecting a passenger does not tell us its job
summary: Widows carry distinctive bacteria, and most brown widows carry one in particular. But the studies sampled whole spiders or half-abdomens, not the gut alone, so whether any of these microbes helps with digestion is still unknown.
status: open
order: 11
taxa: [Latrodectus geometricus, Latrodectus hesperus, Latrodectus mactans]
