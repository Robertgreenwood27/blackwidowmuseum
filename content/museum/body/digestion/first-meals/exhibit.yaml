    note: redback; hatching is not emergence
    sources: [downes1987]
  - value: "1 vs 3"
    unit: weeks
    label: between meals, two rearing regimes
    note: L. geometricus from hatching to adulthood; fruit flies first, larger prey later
    sources: [harvey2025]
observations:
  - id: yolk
    text: Redback development inside the egg sac runs on yolk reserves.
    confidence: supported
    sources: [mowery2022b]
  - id: molt-in-sac
    text: Redbacks hatch and molt once before leaving the egg sac.
    sources: [downes1987]
  - id: sneak
    text: Some redback young approached the female's prey and fed on its far side.
    confidence: supported
    sources: [forster1995]
  - id: sweep
    text: The female sometimes drove these feeders off with sweeps of a leg.
    confidence: supported
    sources: [forster1995]
  - id: flies-first
    text: Brown widows were reared on fruit flies at first and on larger prey later.
