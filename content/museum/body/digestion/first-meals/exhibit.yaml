title: Before the First Catch
kicker: A spiderling begins with a maternal reserve
summary: Hatching, leaving the egg sac and the first meal are different milestones. Yolk carries the young through the first, and the supply of prey afterward decides how many reach adulthood.
status: open
order: 12
taxa: [Latrodectus hasselti, Latrodectus geometricus, Latrodectus hesperus, Latrodectus mactans, Latrodectus variolus]
