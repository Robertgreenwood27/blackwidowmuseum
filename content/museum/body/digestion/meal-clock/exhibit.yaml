accession: BWM-01.14.06
title: A Meal in Hours
kicker: Feeding, digestion and waste run on different clocks
summary: A meal is not a single bite. A southern widow spends around eight hours on a mealworm, moving between feeding sites, and her metabolism stays raised long after the husk is dropped.
