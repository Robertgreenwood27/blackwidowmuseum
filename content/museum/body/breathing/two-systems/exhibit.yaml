id: body.breathing.two-systems
accession: BWM-01.04.01
title: Lungs and Tubes
kicker: A shared starting plan, several evolutionary routes
summary: The first spiders breathed through two pairs of book lungs, as tarantulas still do. Widows keep the front pair and breathe through tubes at the back. Lungs became tubes not once but repeatedly across the spider tree. That makes it a story of branches, not a ladder from primitive to advanced.
status: open
order: 1
