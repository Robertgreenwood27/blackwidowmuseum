id: body.breathing.development
accession: BWM-01.04.10
title: First Breaths
kicker: Build the channels, then renew their lining
summary: In a common cobweb spider, the book lungs begin on the back face of tiny limb buds on the embryo's abdomen. New air and hemolymph channels keep being added as the spider grows. At every molt the cuticle lining of the lungs is shed with the old skin while the living tissue stays.
