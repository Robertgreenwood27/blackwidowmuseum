id: body.breathing.temperature
accession: BWM-01.04.09
title: Hot and Cold Breathing
kicker: Temperature changes demand and water cost
summary: A spider's body is the temperature of its surroundings, so its metabolism rises with heat. Breathing also costs water. In one Chilean tarantula, the lungs accounted for about 60% of the water lost to evaporation. A widow's version of that sum has never been done.
