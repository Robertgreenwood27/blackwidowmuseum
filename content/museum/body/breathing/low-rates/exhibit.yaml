id: body.breathing.low-rates
accession: BWM-01.04.06
title: Living on Little Oxygen
kicker: Measure the gas, keep the body size
summary: A resting adult female widow breathes out about 0.015 millilitres of CO₂ an hour. Spiders as a group run at lower resting rates than many animals their size, though rates vary with size, species and state. One assumption fails — across spiders, how they hunt did not predict how fast they breathe.
