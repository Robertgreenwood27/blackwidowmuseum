title: Slits and Openings
kicker: An entrance can control diffusion
summary: Air enters a widow through three openings. Two lung slits sit at the ends of the crease under the front of the abdomen, with the female's genital plate between them, and one tracheal slit sits just ahead of the spinnerets. In other spiders the lung openings widen and narrow in response to oxygen and carbon dioxide.
