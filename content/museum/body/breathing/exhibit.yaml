observations:
  - id: lungs
    text: Black widows breathe through one pair of book lungs and a tracheal system of air tubes.
    sources: [jocque2006]
  - id: spiracle
    text: In theridiids the tracheal opening is a single broad slit immediately in front of the spinnerets.
    sources: [jocque2006]
  - id: openings
    text: The book lungs open through slits at either end of the epigastric furrow on the underside of the abdomen.
    sources: [snodgrass1952]
  - id: pages
    text: Inside each lung, thin air spaces alternate with hemolymph-filled spaces, stacked like the pages of a book.
    sources: [foelix2011, snodgrass1952]
  - id: exchange
    text: Oxygen crosses the thin walls between air and hemolymph, then returns toward the heart through pulmonary vessels.
    sources: [snodgrass1952]
  - id: hemocyanin
    text: In spiders, oxygen is carried by hemocyanin dissolved in the hemolymph.
    sources: [foelix2011]
