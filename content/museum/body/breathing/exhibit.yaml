title: Book Lungs
kicker: Breathing through pages
summary: Two lungs built like books sit at the front of the abdomen, and a slit just ahead of the spinnerets feeds a second system of air tubes. Eleven halls follow the air from the openings to the blood, then the demands placed on it by rest, hunger, effort, heat, growth and low oxygen.
