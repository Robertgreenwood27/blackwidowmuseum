id: body.breathing.exchange
accession: BWM-01.04.05
title: Across the Thin Wall
kicker: A short crossing, then a circulating carrier
summary: Oxygen diffuses across a wall less than a fifth of a micrometre thick and binds hemocyanin, a copper protein dissolved in the hemolymph. The oxygenated fluid flows to the sinus around the heart and enters it through the ostia. Hemocyanin has been found in widow hemolymph, but how strongly it binds oxygen has not been measured.
