id: body.breathing.submersion
accession: BWM-01.04.11
title: When Oxygen Runs Low
kicker: Low-oxygen air and floodwater are different tests
summary: Western widows came through a day at 2% oxygen when chilled to 1 °C. All of them died when the oxygen fell to 0.5%, and all died at 2% when the air was warmed to 15 °C. Cold lowers the demand, so the same thin air lasts. How long a widow survives underwater has never been measured.
