title: Pages of Air
kicker: Keep the air open and the fluid close
summary: A book lung folds a large surface into a small pocket. Thin air spaces alternate with hemolymph spaces. Cuticle struts hold the air spaces open, and living pillars brace the hemolymph side. No one has counted a widow's pages, so the numbers here come from other spiders.
