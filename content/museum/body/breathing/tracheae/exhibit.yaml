title: Tubes Through the Body
kicker: A tube's destination matters as much as its entrance
summary: Spider air tubes range from short stubs in the abdomen to branches that reach the brain. The widow's tracheal entrance is well established, but no one has fully mapped where its tubes go. The detailed maps come from jumping spiders.
