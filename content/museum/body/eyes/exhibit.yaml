observations:
  - id: rows
    text: Black widows have eight eyes arranged in two transverse rows of four on the front of the carapace.
    sources: [jocque2006, valdezmondragon2023]
  - id: principal
    text: As in other eight-eyed spiders, the anterior median pair are the principal eyes and the other three pairs are secondary eyes.
    sources: [foelix2011]
  - id: no-tapetum
    text: Spider principal eyes lack the reflective tapetum found behind many secondary eyes.
    sources: [foelix2011]
  - id: canoe-tapetum
    text: In the related theridiid Parasteatoda, the secondary eyes have a canoe-shaped tapetum split down its middle.
    confidence: supported
    sources: [gainett2020]
  - id: separated-laterals
    text: Latrodectus has widely separated anterior and posterior lateral eyes, which helps tell it from many other theridiids.
    sources: [peralta2018]
  - id: limited-vision
    text: Western black widows have poor vision and locate prey through vibrations in the web.
    confidence: supported
    sources: [sergi2021]
terms:
  - { term: principal eye, def: one of the anterior median pair, with its own retinal organisation }
  - { term: secondary eye, def: any of the other three pairs of eyes }
  - { term: tapetum, def: a reflective layer behind the photoreceptors that gives light a second pass }
related: [senses.vision, senses.vibration]
