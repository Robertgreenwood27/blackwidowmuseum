title: Lock and Key
kicker: First anchor the apparatus, then follow the duct
summary: Before the embolus can enter, the bulb clamps onto the female with hooks and sockets of its own. Micro-CT of brown widows caught mid-mating shows those contacts. A tight fit is not an absolute barrier, though, because redbacks and katipō can hybridise.
