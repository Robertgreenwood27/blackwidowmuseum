id: body.pedipalps.senses-and-tasks
accession: BWM-01.12.10
title: Palps at Work
kicker: The same appendage also touches and handles
summary: A male's bulb does not stop his palps from doing everything else palps do. In both sexes they carry open-tipped hairs that probably taste, and they help filter food at the mouth. Males also groom them between matings.
