observations:
  - id: open-tipped
    text: Western widow palps carry curved, blunt, open-tipped hairs on their undersides.
    sources: [ross1979]
  - id: both
    text: Ross and Smith found these presumed chemoreceptors in females and males alike.
    sources: [ross1979]
  - id: touch-hairs
    text: Sharp-tipped hairs, presumed to sense touch, are distinct from the open-tipped ones.
    confidence: supported
