title: The Hydraulic Unfolding
kicker: Pressure changes the shape of the apparatus
summary: There are no muscles inside the bulb. Hemolymph forced into folded membranes swells it, and the swelling tilts and turns its hard parts into position. Widows have been watched inflating; nobody has yet measured the pressure.
