observations:
  - id: levi
    text: Levi's historical system grouped many widows by embolus coil categories.
    sources: [garb2004]
  - id: lotz
    text: Lotz's African revision combines genital drawings with characters of the abdominal setae.
    sources: [lotz1994]
  - id: homology
    text: The 2007 theridiid study explicitly tested rival identifications of the palp's sclerites.
    sources: [agnarsson2007]
  - id: lucacha
    text: The L. lucacha diagnosis pairs the form of the embolus with characters outside the genitalia.
    sources: [miller2026b]
  - id: integrative
    text: The 2026 atlas checks molecular clusters against genitalia, female setae and egg-sac traits.
    sources: [miller2026]
  - id: catalogue
    text: The World Spider Catalog keeps historical names and later identifications as separate records.
