title: Reading a Palp
kicker: Compare views before assigning a name
summary: Genitalia are the core evidence in widow taxonomy. A name is never read off one photograph, though; it comes from combining characters, views and, now, DNA. Line drawings, SEM and micro-CT each answer a different question about the same organ.
