observations:
  - id: cymbium
    text: A spoon-shaped cymbium, the modified tarsus, supports the widow's copulatory organ.
    sources: [bhatnagar1962]
  - id: tegulum
    text: The subtegulum and tegulum form the bulb's basal and principal divisions.
    sources: [agnarsson2007]
  - id: three-processes
    text: The 2007 theridiid scheme distinguishes a conductor, a median apophysis and a theridiid tegular apophysis.
    confidence: supported
    sources: [agnarsson2007]
  - id: hook-groove
    text: In Latrodectus, a hooked embolus base fits into the grooved base of the conductor.
    confidence: supported
    sources: [agnarsson2004]
  - id: spermophor
    text: The internal sperm duct of L. revivensis runs from a blind fundus through a reservoir to a narrow outgoing duct.
    sources: [berendonck2002]
  - id: truncus
    text: Its embolus pairs a hardened outer truncus with a membranous inner strip, the pars pendula.
    sources: [berendonck2002]
  - id: vocabularies
    text: Older accounts name a radix and a terminal apophysis; whether these match the modern parts one-to-one is unresolved.
    confidence: debated
    sources: [bhatnagar1962, agnarsson2007]
