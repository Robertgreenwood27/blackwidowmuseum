title: Parts of the Bulb
kicker: A cup, a reservoir and interlocking pieces
summary: The bulb is an assembly of hardened sclerites joined by soft membrane, seated in a cup and threaded with a blind-ended sperm duct. The names depend on whose scheme you follow, so each label here keeps its author.
