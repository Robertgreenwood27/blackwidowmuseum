observations:
  - id: segments
    text: A palp runs coxa, trochanter, femur, patella, tibia, tarsus.
    sources: [jocque2006]
  - id: no-metatarsus
    text: It lacks the separate metatarsus of a walking leg.
    sources: [jocque2006]
  - id: mouth
    text: The coxal lobes of the palps border the passage leading to the mouth.
    sources: [snodgrass1952]
  - id: embryo
    text: Brown widow embryos grow an inward lobe, the endite, on each pedipalp.
    confidence: supported
    sources: [liu2009]
  - id: claw-varies
    text: Female palpal claws vary among theridiid lineages and are absent in some, such as Phoroncidia.
    confidence: supported
    sources: [agnarsson2004]
  - id: tendons
    text: In the tarantula Snodgrass illustrated, the female's palpal claw is worked by levator and depressor tendons.
    sources: [snodgrass1952]
terms:
  - { term: coxa, def: the basal segment of a limb, attached to the prosoma }
  - { term: endite, def: an inward lobe on the palpal coxa, used in feeding }
  - { term: maxilla, def: the traditional name for that feeding lobe — not an extra pair of jaws }
  - { term: serial homology, def: correspondence among repeated appendages along the body }
