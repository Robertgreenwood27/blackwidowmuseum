id: body.pedipalps.appendage
accession: BWM-01.12.01
title: A Leg That Became a Tool
kicker: Beside the mouth, before the legs
summary: A palp is built like a walking leg but with one segment fewer. Its base helps feed the spider; its tip ends in a single claw in females and young, and in a copulatory bulb in adult males.
status: open
order: 1
taxa: [Latrodectus geometricus]
