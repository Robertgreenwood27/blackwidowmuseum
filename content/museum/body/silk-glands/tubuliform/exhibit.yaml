id: body.silk-glands.tubuliform
accession: BWM-01.16.04
title: A Factory That Swells for Eggs
kicker: Reproduction reshapes the organ
summary: Tubuliform glands make the main fibres of the egg case from a spidroin and several other proteins. They swell as eggs develop and shrink after spinning, tying the gland to the reproductive cycle.
status: open
order: 4
