observations:
  - id: shape
    text: Tubuliform glands are long tubes with curled ducts.
    sources:
      - chaw2018
  - id: outlets
    text: Their outlets are on both pairs of rear spinnerets.
    sources:
      - coddington1989
  - id: tusp1
    text: TuSp1 is a repeat-rich spidroin identified in western widow egg-case silk.
    sources:
      - hu2005
  - id: ecps
    text: ECP-1 and ECP-2 are separate, non-spidroin proteins tied to the large egg-case fibres.
    sources:
      - hu2006
  - id: crosslinks
    text: Their cysteine-rich regions may link the fibre's molecules together.
    sources:
      - hu2006
    confidence: supported
  - id: ecp3
    text: A third protein, ECP3, was found in the gland, the stored silk and the finished sac.
    sources:
      - shanafelt2021
    confidence: supported
  - id: more-proteins
    text: The same study also found CRP4 and fasciclin in all three.
    sources:
      - shanafelt2021
    confidence: supported
  - id: timing
    text: As eggs fill with yolk, TuSp1 and ECP-2 switch on earlier than ECP-1.
    sources:
      - casem2010
    confidence: supported
  - id: flattened
    text: After an egg case is spun, the glands look flattened.
    sources:
      - casem2010
    confidence: supported
  - id: females-only
    text: Adult males lack working tubuliform outlets.
    sources:
      - correagarhwal2017
    confidence: supported
terms:
