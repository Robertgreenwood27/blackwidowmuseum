title: From Liquid to Fibre
kicker: The duct changes the conditions
summary: Silk is stored as a concentrated liquid and leaves the body as a solid. Widow experiments show acid, salts and shear each push the protein toward a fibre; measurements from other spiders fill in the duct itself.
