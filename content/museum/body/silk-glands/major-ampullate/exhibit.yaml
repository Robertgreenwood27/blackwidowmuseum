id: body.silk-glands.major-ampullate
accession: BWM-01.16.01
title: The Gland Behind the Lifeline
kicker: The storage sac also adds to the recipe
summary: The best-studied widow gland is more than a reservoir with a nozzle. Its tail makes protein, its sac stores and coats it, and its duct is lined with specialised cells. How strong the finished thread is belongs to the Safety Line.
