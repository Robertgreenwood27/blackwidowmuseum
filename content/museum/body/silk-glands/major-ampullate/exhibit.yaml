observations:
  - id: tail
    text: The tail of the major ampullate gland is built for heavy protein synthesis.
    sources:
      - casem2002
  - id: ampulla
    text: Its sac, the ampulla, stores the liquid silk.
    sources:
      - casem2002
  - id: coating
    text: The sac adds a dense secretion that appears to coat the core arriving from the tail.
    sources:
      - casem2002
    confidence: supported
  - id: honeycomb
    text: One kind of duct cell is packed with vesicles that look like honeycomb.
    sources:
      - casem2002
  - id: microvilli
    text: Another kind of duct cell carries dense microvilli on the side facing the silk.
    sources:
      - casem2002
  - id: masp
    text: MaSp1 and MaSp2 are the main structural proteins of widow dragline.
    sources:
      - ayoub2007
  - id: extras
    text: Dragline also contains smaller amounts of AcSp1 and cysteine-rich proteins.
    sources:
      - larracas2016
    confidence: supported
  - id: shared
    text: An esterase, a possible lectin and a mucin-like protein were found in both the gland and the fibre.
    sources:
      - chaw2015
    confidence: supported
  - id: outlet
    text: Its outlet sits on the front spinnerets, surrounded by pyriform outlets.
    sources:
      - coddington1989
  - id: uses
    text: Major ampullate silk makes the lifeline and the structural threads of the web.
    sources:
      - blackledge2005
terms:
