observations:
  - id: no-introns
    text: The first complete western widow MaSp1 and MaSp2 genes had no introns.
    sources:
      - ayoub2007
  - id: structure
    text: Both encode long repetitive middles flanked by less repetitive ends.
    sources:
      - ayoub2007
  - id: glycine-alanine
    text: Glycine and alanine make up more than 64% of each MaSp protein.
    sources:
      - ayoub2007
  - id: multiple
    text: Western and brown widows each carry several working MaSp1 genes.
    sources:
      - ayoub2008
    confidence: supported
  - id: pseudogene
    text: A broken MaSp1 copy, a pseudogene, was also found in the western widow.
    sources:
      - ayoub2008
  - id: recombination
    text: The widow's dragline genes appear to swap sequence with one another.
    sources:
      - ayoub2008
    confidence: supported
  - id: 2014-design
    text: The 2014 transcriptome compared silk glands with venom glands and the front body.
    sources:
      - clarke2014
  - id: unknowns
    text: Many of the silk-gland transcripts had no recognisable function.
    sources:
      - clarke2014
  - id: overlap
    text: MaSp1 and MaSp2 are also switched on in the egg-case and front glue glands.
    sources:
      - clarke2017
    confidence: supported
  - id: no-duplication-needed
    text: Glands changed which genes they use without needing new gene copies.
    sources:
      - clarke2017
    confidence: supported
  - id: assembly
    text: The 2024 genome was built from long DNA reads, chromosome-contact data and RNA.
    sources:
      - miles2024
terms:
  - term: genome / transcriptome / proteome
    def: all the DNA / the RNA in a tissue / the proteins in a sample
  - term: locus
    def: a gene's position in the genome
  - term: paralog
    def: a related gene made by duplication
  - term: pseudogene
    def: a gene copy too damaged to make its normal product
  - term: Hi-C
    def: data on which stretches of DNA touch, used to assemble chromosomes
