id: body.silk-glands.genes
accession: BWM-01.16.09
title: A Library Larger Than Seven Recipes
kicker: One name can cover several genes
summary: "Widow silk research moved from single complete genes to whole-tissue gene readouts and a chromosome-scale genome. Each answers a different question: what DNA is there, what a gland switches on, and what reaches the thread."
status: open
order: 9
taxa:
  - Latrodectus hesperus
  - Latrodectus geometricus
  - Latrodectus elegans
  - Steatoda grossa
