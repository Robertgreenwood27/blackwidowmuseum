observations:
  - id: shape
    text: Minor ampullate glands have smaller sacs, shorter tails and folded ducts.
    sources:
      - chaw2018
  - id: outlet
    text: Their outlets are on the middle pair of rear spinnerets.
    sources:
      - coddington1989
  - id: in-wrap
    text: Peptides of a MiSp1-like protein were found in western widow prey-wrapping silk.
    sources:
      - lamattina2008
    confidence: supported
  - id: concentrated
    text: Its transcripts were concentrated in the minor ampullate gland in the first comparison.
    sources:
      - lamattina2008
    confidence: supported
  - id: sequence
    text: The protein's sequence runs alanine stretches interrupted by glycine.
    sources:
      - lamattina2008
  - id: overlap
    text: Major and minor ampullate glands share more of their proteins with each other than with the egg-case gland.
    sources:
      - chaw2015
    confidence: supported
  - id: ecp3
    text: Low levels of the egg-case gene ECP3 are switched on in minor ampullate tissue.
    sources:
      - shanafelt2021
    confidence: supported
  - id: unequal
    text: The two MiSp genes are not expressed equally in the gland.
    sources:
      - vienneauhathaway2017
    confidence: supported
  - id: species-differ
    text: Minor fibres from western widows, brown widows and false widows differed mechanically.
    sources:
      - vienneauhathaway2017
    confidence: supported
  - id: males
    text: In mature males, minor ampullate genes are the most highly expressed silk genes.
    sources:
      - correagarhwal2017
    confidence: supported
terms:
