id: body.silk-glands.minor-ampullate
accession: BWM-01.16.02
title: A Smaller Ampulla, a Shared Product
kicker: Small does not mean expendable
summary: Minor ampullate silk goes into the widow's prey wrapping. Fibres drawn straight from its outlets are a distinct material, and sequencing shows more than one gene behind it.
status: open
order: 2
taxa:
  - Latrodectus hesperus
  - Latrodectus geometricus
  - Latrodectus variolus
  - Steatoda grossa
