title: The Anchorage Workshop
kicker: A small gland makes a complex joint
summary: Pyriform glands supply the cement that fixes structural threads to surfaces. Widow studies find their protein, PySp1, in the gland and in attachment discs. How the discs hold and let go belongs to Two Kinds of Anchor.
