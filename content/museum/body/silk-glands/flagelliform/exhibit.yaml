observations:
  - id: shape
    text: The putative flagelliform glands have tails and thicker ducts than aciniform glands.
    sources:
      - chaw2018
    confidence: supported
  - id: outlet
    text: Its duct runs to a small outlet beside the aggregate outlets on the rear spinnerets.
    sources:
      - chaw2018
    confidence: supported
  - id: tentative
    text: An earlier study of northern widow spinnerets marked the flagelliform outlet only tentatively.
    sources:
      - coddington1989
  - id: pooled
    text: In the gene-expression study, flagelliform glands were sampled together with the surrounding aciniform glands.
    sources:
