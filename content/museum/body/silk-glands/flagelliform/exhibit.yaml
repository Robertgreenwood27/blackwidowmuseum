id: body.silk-glands.flagelliform
accession: BWM-01.16.07
title: The Factory With No Known Product
kicker: An organ can outlast its job
summary: Widows keep small glands identified as flagelliform, the gland orb weavers use for their stretchy capture spiral. Widows build no spiral. The gland is real; what it makes for a cobweb weaver is still unknown.
status: open
order: 7
taxa:
