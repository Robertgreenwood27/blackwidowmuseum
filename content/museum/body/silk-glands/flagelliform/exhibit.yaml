  - id: reduced
    text: Western widow flagelliform glands are smaller than those of the common house spider.
    sources:
      - ayoub2021
    confidence: supported
  - id: in-sac
    text: A flagelliform spidroin variant turned up among proteins in whole western widow egg sacs.
    sources:
