id: body.silk-glands.life-and-supply
accession: BWM-01.16.10
title: Growing, Spending, Replenishing
kicker: The factory changes with the spider
summary: Age, sex and diet change what the glands make. Widow studies show males switching emphasis, egg-case genes staying on after spinning, and protein-starved females making stickier glue. Stories about rapid refilling and efficient recycling need evidence that does not yet exist for widows.
status: open
