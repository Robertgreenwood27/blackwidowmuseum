id: body.silk-glands.aciniform
accession: BWM-01.16.03
title: Many Small Wrapping Factories
kicker: A huge protein from a tiny organ
summary: Hundreds of small aciniform glands feed the rear spinnerets. Their protein, AcSp1, goes into prey wrapping and the fine fibres of the egg sac, and its gene is one of the largest ever sequenced from a widow.
status: open
