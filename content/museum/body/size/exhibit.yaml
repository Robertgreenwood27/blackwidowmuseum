observations:
  - id: southern
    text: Southern black widow females typically measure about 12.5 mm in body length; males about 6 mm.
    sources: [eiden2013]
  - id: northern
    text: Kaston recorded northern widow body lengths of 7.4–13 mm in females and 4.5–8.3 mm in males.
    confidence: supported
    sources: [kaston1970, ebeling1975]
  - id: redback
    text: Redback females are about 10 mm long; males only 3–4 mm.
    sources: [australianmuseum2026]
  - id: brown
    text: Brown widow females measure 8.1–13 mm and males 3.4–6.2 mm.
    sources: [nentwig2026]
  - id: span
    text: With legs included, a female southern widow typically spans about 37.5–50 mm.
    sources: [eiden2013]
  - id: male-legs
    text: Male western widows can have legs nearly as long as a female's, despite much shorter bodies.
    sources: [vetter2017]
  - id: condition
    text: A full meal or a load of eggs changes a spider's body length without changing its legs.
    sources: [australianmuseum2018]
