title: Eight Working Limbs
kicker: Pull, hold, reel and clean
summary: Legs handle silk as well as carry weight. Filmed brown widows give each leg pair its own job while building a gumfoot line, and redbacks probe prey with a foreleg, carry it between the hind legs and wipe glue off through the mouthparts.
