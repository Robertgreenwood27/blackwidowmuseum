id: body.legs
accession: BWM-01.11
title: Seven Segments
kicker: Muscle bends them; blood pressure straightens them
summary: Every leg has seven segments and ends in three claws. Two of its main joints have no muscle to extend them — hemolymph pressure does the job.
status: open
order: 6
taxa: [Latrodectus, Latrodectus variolus]
figures:
  - value: 7
    label: segments per leg
    note: coxa to tarsus; claws not counted
    sources: [foelix2011]
  - value: 3
    label: claws on each foot
    note: a paired upper set and a smaller median claw
    sources: [jocque2006]
  - value: 2
    label: major joints without extensor muscles
    note: femur–patella and tibia–metatarsus
    sources: [foelix2011]
observations:
  - id: sequence
    text: From body to foot, each leg runs coxa, trochanter, femur, patella, tibia, metatarsus, tarsus.
    sources: [foelix2011]
  - id: leg-formula
    text: In Lotz's revision of African widows the first legs are longest, followed by the fourth, second and third.
    confidence: supported
    sources: [lotz1994]
  - id: hydraulic
    text: The femur–patella and tibia–metatarsus joints of spiders have no extensor muscles.
    sources: [foelix2011]
  - id: pressure
    text: Raised hemolymph pressure supplies the force that straightens these joints.
    confidence: supported
    sources: [parry1959]
  - id: claws
    text: In theridiids each walking foot ends in three claws.
    sources: [jocque2006]
  - id: autotomy
    text: Widows can shed a leg at the coxa–trochanter joint, a built-in breaking point.
    confidence: supported
    sources: [randall1981]
  - id: no-regrowth
    text: Legs shed this way did not regenerate in Randall's northern widow experiments.
    confidence: supported
    sources: [randall1981]
  - id: distal-repair
    text: Legs cut through the middle of the femur or farther out did regenerate in the same experiments.
    confidence: supported
    sources: [randall1981]
terms:
  - { term: hemolymph, def: the circulating fluid of a spider's open circulatory system }
  - { term: flexor, def: a muscle that bends a joint }
  - { term: autotomy, def: self-amputation at a preformed breaking point }
  - { term: leg formula, def: the four leg pairs ranked from longest to shortest }
related: [body.comb-foot, body.circulation, senses.slit-sensilla]
