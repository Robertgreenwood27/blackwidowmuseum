observations:
  - id: sequence
    text: From body to foot, each leg runs coxa, trochanter, femur, patella, tibia, metatarsus, tarsus.
    sources: [foelix2011]
  - id: leg-formula
    text: In Lotz's revision of African widows the first legs are longest, followed by the fourth, second and third.
    confidence: supported
    sources: [lotz1994]
  - id: hydraulic
    text: The femur–patella and tibia–metatarsus joints of spiders have no extensor muscles.
    sources: [foelix2011]
  - id: pressure
    text: In house spiders, raised hemolymph pressure supplies the force that straightens these joints.
    confidence: supported
    sources: [parry1959]
  - id: claws
    text: In theridiids each walking foot ends in three claws.
    sources: [jocque2006]
  - id: threads
    text: Redbacks climb a scaffold of single silk threads, gripping them with the claws at their leg tips.
    confidence: supported
    sources: [clarke1986]
  - id: autotomy
    text: Widows can shed a leg at the coxa–trochanter joint, a built-in breaking point.
    confidence: supported
    sources: [randall1981]
  - id: no-regrowth
    text: Legs shed this way did not regenerate in Randall's northern widow experiments.
    confidence: supported
    sources: [randall1981]
  - id: distal-repair
    text: Legs cut at mid-femur or farther out did regenerate in the same experiments.
    confidence: supported
    sources: [randall1981]
  - id: growth
    text: Brown and southern widow legs change proportion differently as the spiders grow.
    confidence: supported
    sources: [barrantes2026]
