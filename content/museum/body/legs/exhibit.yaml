id: body.legs
accession: BWM-01.11
title: Seven Segments
kicker: Muscle bends them; blood pressure straightens them
summary: Every leg has seven segments and ends in three claws. Two of its main joints have no muscle to extend them; hemolymph pressure does the job. Eleven halls follow the legs further, into their joints and grip, their work on silk and in courtship, and what happens when one is lost.
status: open
order: 6
taxa: [Latrodectus variolus, Latrodectus hasselti, Latrodectus hesperus, Latrodectus geometricus, Latrodectus mactans]
