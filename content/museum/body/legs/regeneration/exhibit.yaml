    label: the closest cut that still regrew
    note: L. variolus, Randall's amputation experiments
    featured: true
    sources: [randall1981]
  - value: 5 of 20
    label: survivors after whole-coxa removal
    note: fourth-instar L. variolus, 27 °C; survival of the surgery, not a regrowth rate
    sources: [randall1982]
  - value: "≤1"
    unit: day
    label: to recover running after losing two legs
    note: a comparator tarantula; performance, not regrowth
    sources: [kane2025]
observations:
