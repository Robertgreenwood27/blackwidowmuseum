id: body.legs.regeneration
accession: BWM-01.11.09
title: A Conditional Return
kicker: The location of loss changes the outcome
summary: Northern widows grew back legs lost far enough from the body, but never legs they had shed themselves. When a whole coxa was removed, nothing regrew; instead the neighbouring leg's base slid over to fill the gap.
status: open
order: 9
taxa: [Latrodectus variolus]
