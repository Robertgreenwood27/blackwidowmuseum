title: A Limb Covered in Instruments
kicker: Locate the sensors, then follow their signals
summary: The legs carry most of a widow's sense organs. A small atlas of brown-widow legs counts and places them, and microscopy of western-widow feet shows open-tipped hairs that probably taste. How each one works is told in the Senses vault.
