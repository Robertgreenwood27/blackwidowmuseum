  - value: 3
    label: claws on every walking foot
    note: theridiid family character; bristles are not counted as claws
    sources: [jocque2006]
  - value: Hook + bristles
    label: the thread clasp
    note: general web-spider mechanism, not a measured widow grip force
    sources: [foelix2011]
  - value: Not yet
    label: a widow grip force or hanging endurance
    note: no such measurement found in this research pass
observations:
  - id: three
    text: Theridiid walking feet bear three claws.
    sources: [jocque2006]
  - id: clasp
    text: In web-building spiders, the median hook presses a silk thread against opposing serrated bristles.
    sources: [foelix2011]
  - id: release
    text: Raising the hook releases the thread.
    sources: [foelix2011]
  - id: redback-threads
    text: Redbacks grip individual scaffold threads with the claws at their leg tips.
    confidence: supported
    sources: [clarke1986]
  - id: stiff-tip
    text: Clarke linked the redback's restricted metatarsus–tarsus movement to supporting itself on single threads.
    confidence: debated
    sources: [clarke1986]
  - id: not-pads
    text: The scopulae and claw tufts of hunting spiders are adhesive hair pads, a different solution from a thread clasp.
    sources: [wolff2013]
terms:
