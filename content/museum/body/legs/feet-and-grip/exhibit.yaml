id: body.legs.feet-and-grip
accession: BWM-01.11.04
title: A Foot Around a Thread
kicker: Holding silk is a contact problem
summary: A web-builder's foot is a clasp, not a sticky pad. A hooked median claw presses a thread against serrated bristles, and lifting the hook lets it go. That is how a widow hangs inverted in her tangle.
status: open
order: 4
taxa: [Latrodectus hasselti]
