  - { term: pectinate claw, def: a claw with comb-like teeth }
  - { term: auxiliary bristle, def: a serrated bristle that opposes the median claw }
  - { term: scopula, def: a dense pad of adhesive hairs, found in many hunting spiders }
  - { term: claw tuft, def: an adhesive hair pad beneath the claws }
