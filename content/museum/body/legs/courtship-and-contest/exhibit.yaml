observations:
  - id: pluck
    text: Western-widow males plucked the web with one leg or with several legs on different threads.
    confidence: supported
    sources: [sivalinghem2021]
  - id: bounce
    text: Their bounces began with leg flexion that drove the body against the silk or the female.
    confidence: supported
    sources: [sivalinghem2021]
  - id: touch
    text: Courting western widows touched leg to leg before closer contact.
    confidence: supported
    sources: [ross1979]
  - id: jerk
    text: Redback males flexed and jerked their legs before withdrawing after copulation.
    confidence: supported
    sources: [forster1995]
  - id: purchase
    text: They gripped the female's abdomen with several legs while freeing the embolus.
    confidence: supported
    sources: [forster1995]
  - id: contest
    text: In staged contests, larger redback males did not consistently chase off or disable smaller rivals.
    confidence: supported
    sources: [stoltz2008]
terms:
