id: body.legs.leg-loss
accession: BWM-01.11.08
title: The Break at the Base
kicker: Shedding and cutting are different injuries
summary: A widow can let go of a leg at a built-in breaking plane between coxa and trochanter, leaving the coxa behind. How often wild widows lose legs, and what it costs them, has not yet been measured.
status: open
order: 8
taxa: [Latrodectus variolus, Latrodectus hesperus]
