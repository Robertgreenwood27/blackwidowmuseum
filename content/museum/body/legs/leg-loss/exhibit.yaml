    label: where the leg comes away
    note: L. variolus, experimentally induced; the coxa stays on the body
    featured: true
    sources: [randall1981]
  - value: Not yet
    label: a count of widows missing legs in the wild
    note: no field survey with a denominator found in this research pass
observations:
  - id: ligation
    text: Tying off a northern widow's leg at or above mid-tibia made her shed it at the coxa–trochanter joint.
    confidence: supported
    sources: [randall1981]
  - id: gradient
    text: The closer to the body the tie, the more often the leg was shed.
    confidence: supported
    sources: [randall1981]
  - id: pinch
    text: Western widows pinched in a defence experiment did not shed legs.
    confidence: supported
    sources: [nelsen2014]
  - id: zygiella-web
    text: Orb weavers missing legs built webs with less silk but the same capture area.
    confidence: supported
    sources: [pasquet2011]
  - id: zygiella-capture
    text: That study found no difference in prey capture after losing one or two legs, under laboratory conditions.
    confidence: supported
    sources: [pasquet2011]
