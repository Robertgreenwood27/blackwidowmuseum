observations:
  - id: measured
    text: Parry and Brown measured pressure inside house-spider legs and related it to the force of extension.
    sources: [parry1959]
  - id: enough
    text: The brief peaks were high enough to explain the force legs produced when accelerating an attached weight.
    confidence: supported
    sources: [parry1959]
  - id: squeeze
    text: Squeezing the prosoma raises the pressure in a spider's legs.
    sources: [foelix2011]
  - id: necrobotics
    text: Air pumped into dead wolf spiders extended their legs, and releasing it let them close.
    sources: [yap2022]
  - id: death-curl
    text: Losing this pressure explains why spiders' legs curl inward when they die.
    confidence: supported
    sources: [yap2022]
