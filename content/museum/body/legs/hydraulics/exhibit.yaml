id: body.legs.hydraulics
accession: BWM-01.11.03
title: Straightened by Pressure
kicker: Fluid pressure supplies the opposing push
summary: Two major joints straighten when hemolymph pressure pushes on their flexible membranes. The classic measurements come from house spiders; nobody has yet measured the pressure inside a widow's leg.
status: open
order: 3
taxa: []
