id: body.chelicerae.muscles
accession: BWM-01.05.06
title: Opening and Closing
kicker: Muscles at the hinge, pressure at the base
summary: Inside each paturon a small opener and a larger closer work the fang on a two-point hinge. Moving the whole chelicera is another matter. In a 2025 experiment on western widows, body-fluid pressure alone pushed the chelicerae outward.
status: open
order: 6
taxa: [Latrodectus hesperus]
