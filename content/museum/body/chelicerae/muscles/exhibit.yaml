    note: freshly killed females; no live bite-force recordings
    sources: [wood2025]
  - value: "+0.33"
    unit: mm
    label: chelicerae pushed outward under raised pressure
    note: mean side-view change; elevation also rose +9.9°
    sources: [wood2025]
observations:
  - id: opener
    text: The fang extensor swings the fang out of its resting groove.
    sources: [foelix2011]
  - id: closer
    text: The larger flexor closes the fang back toward the paturon.
    sources: [foelix2011]
  - id: tendons
    text: Both muscles pull across the hinge through cuticular attachments.
    sources: [snodgrass1952]
  - id: bicondylar
    text: The fang–paturon joint turns on two points of contact.
    sources: [black2025]
  - id: hydraulic
    text: Raised fluid pressure pushed the chelicerae forward and outward in the sampled western widows.
    confidence: supported
    sources: [wood2025]
  - id: web-builders
    text: A comparative study estimated from muscle anatomy that web-building spiders bite more weakly than free hunters.
    confidence: supported
    sources: [black2025]
terms:
