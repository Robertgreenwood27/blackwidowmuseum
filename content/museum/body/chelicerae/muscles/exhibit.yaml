  - { term: extrinsic muscle, def: one running from the prosoma to the cheliceral base }
  - { term: flexor / extensor, def: closer / opener }
  - { term: apodeme, def: an inward cuticular tendon to which muscle attaches }
  - { term: bicondylar, def: hinged on two contact points, which fix the axis of rotation }
