id: body.chelicerae.fang-materials
accession: BWM-01.05.04
title: Metal-Tipped
kicker: A hard point made from a graded composite
summary: Studied spider fangs combine chitin and protein with local enrichment in zinc. Histidine-rich protein binds the metal, making the working tip harder than the base. No one has yet mapped the chemistry of a widow's fang, so every number here comes from other spiders.
status: open
order: 4
