id: body.chelicerae
accession: BWM-01.05
title: Chelicerae & Fangs
kicker: A hinged tool at the front of the body
summary: Each chelicera is a stout base with a hinged fang folded into it. The two fangs close toward each other like pincers, and venom leaves through a pore just short of each tip. Twelve halls follow this first pair of appendages through its anatomy, materials, movement, growth and work.
status: open
