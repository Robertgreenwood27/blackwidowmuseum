observations:
  - id: segments
    text: Like other spiders, widows have chelicerae made of a basal segment and an articulated fang.
    sources: [foelix2011]
  - id: labidognath
    text: Widows are labidognath — their fangs close toward one another, unlike the parallel, downward-striking fangs of tarantulas.
    sources: [foelix2011]
  - id: rest
    text: At rest each fang folds into a groove in its basal segment, like a pocket-knife blade.
    sources: [foelix2011]
  - id: muscles
    text: Opposing muscles inside the basal segment open and close the fang.
    sources: [foelix2011]
  - id: outlet
    text: The venom duct opens just short of the fang's extreme tip, not at the point itself.
    sources: [foelix2011]
  - id: toothless
    text: Latrodectus has no teeth along the cheliceral groove; this is not true of every theridiid.
    sources: [peralta2018, jocque2006]
  - id: female-bites
    text: Adult females have stronger biting muscles and larger venom reserves than males, and cause almost all medically important bites.
    sources: [vetter2017]
  - id: male-bite
    text: A documented bite by a male brown widow caused local symptoms, so male fangs can pierce human skin.
    confidence: supported
    sources: [peralta2018]
terms:
  - { term: chelicera, def: one of the paired front appendages that carry the fangs }
  - { term: paturon, def: the stout basal segment of a chelicera }
  - { term: labidognath, def: with fangs that close toward one another, pincer-fashion }
  - { term: subterminal, def: near the tip but not at its very end }
