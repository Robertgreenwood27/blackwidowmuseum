id: body.chelicerae
accession: BWM-01.05
title: Chelicerae & Fangs
kicker: The delivery system
summary: Each chelicera is a stout base with a hinged fang folded into it. The two fangs close toward each other like pincers, and venom leaves through a pore just short of each tip.
status: open
