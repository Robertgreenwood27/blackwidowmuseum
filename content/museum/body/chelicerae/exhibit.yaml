observations:
  - id: first-pair
    text: A widow's first pair of prosomal appendages carries the venom-delivering fangs.
    sources: [foelix2011, snodgrass1952]
  - id: segments
    text: Like other spiders, widows have chelicerae made of a basal segment and an articulated fang.
    sources: [foelix2011]
  - id: labidognath
    text: Widows are labidognath — their fangs close toward one another, unlike the roughly parallel, downward-striking fangs of tarantulas.
    sources: [foelix2011, nelsen2014]
  - id: rest
    text: At rest each fang folds into a groove in its basal segment, like a pocket-knife blade.
    sources: [foelix2011]
  - id: muscles
    text: A small opener and a larger closer inside the basal segment work the fang.
    sources: [foelix2011]
  - id: outlet
    text: The venom duct opens just short of the fang's extreme tip, not at the point itself.
    sources: [foelix2011, snodgrass1952]
  - id: toothless
    text: Latrodectus has no teeth along the cheliceral groove; this is not true of most theridiids.
    sources: [peralta2018, agnarsson2004]
  - id: regrasp
    text: Feeding brown widows repeatedly let go of their prey and grip it again with the fangs.
    confidence: supported
    sources: [eberhard2006]
  - id: dry
    text: Western widows can bite without releasing detectable venom.
    confidence: supported
    sources: [nelsen2014]
  - id: male-bite
    text: A documented bite by a male brown widow caused local symptoms, so male fangs can pierce human skin.
    confidence: supported
    sources: [peralta2018]
terms:
  - { term: chelicera, def: one of the paired front appendages that carry the fangs; plural chelicerae }
  - { term: paturon, def: the stout basal segment of a chelicera }
  - { term: labidognath, def: with fangs that close toward one another, pincer-fashion }
  - { term: subterminal, def: near the tip but not at its very end }
