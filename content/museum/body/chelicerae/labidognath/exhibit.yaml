title: Pincers, Not Picks
kicker: Two tools approach from opposite sides
summary: Widow fangs close toward each other, the arrangement shared by most spiders. Tarantulas and their kin strike with roughly parallel fangs. The difference is one of direction, not of strength, and neither arrangement is a rung on a ladder.
