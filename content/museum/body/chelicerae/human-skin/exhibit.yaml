id: body.chelicerae.human-skin
accession: BWM-01.05.11
title: Can It Pierce You?
kicker: Small does not mean mechanically impossible
summary: A female widow's fangs can breach human skin. So, in at least one identified case, can a male's. Experiments show widows are reluctant to bite at all. Most will flee, freeze or flick silk before they bite, and pinching rather than prodding is what usually provokes it.
