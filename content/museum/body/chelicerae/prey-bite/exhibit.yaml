id: body.chelicerae.prey-bite
accession: BWM-01.05.08
title: Biting Prey
kicker: Brief contact with a restrained target
summary: Silk does the restraining, so the fangs need only brief contact. Redbacks usually wrap struggling prey before the first bite, then bite, withdraw, wrap more and return. Not every observer has seen the same sequence.
status: open
order: 8
taxa: [Latrodectus hasselti, Latrodectus geometricus]
