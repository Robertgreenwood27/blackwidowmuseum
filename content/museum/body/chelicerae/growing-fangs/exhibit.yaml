id: body.chelicerae.growing-fangs
accession: BWM-01.05.10
title: New Fangs Every Molt
kicker: A replacement surface must become a working point
summary: Cheliceral buds appear early in the embryo, but the fangs come later. At every growth molt the old fang's cuticle leaves with the shed skin. In a studied comparison spider, the new fang goes on gaining its zinc after the molt.
status: open
order: 10
