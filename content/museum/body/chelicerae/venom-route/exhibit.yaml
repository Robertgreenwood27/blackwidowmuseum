id: body.chelicerae.venom-route
accession: BWM-01.05.07
title: From Gland to Pore
kicker: A separate route through each fang
summary: Venom runs from a pair of glands in the front body down a duct through each chelicera to an outlet short of each point. Experiments on western widows separate puncturing from envenoming. More than half of single defensive bites delivered no detectable venom.
status: open
order: 7
taxa: [Latrodectus hesperus, Parasteatoda tepidariorum]
figures:
  - value: 2
    label: gland-to-fang routes
    note: one per side, never cross-connected
    sources: [snodgrass1952, reese1944]
  - value: 53.7
    unit: "%"
    label: single bites with no detectable venom
    note: western widow; 67 once-bitten targets from 20 females
    featured: true
    sources: [nelsen2014]
  - value: "34.6 ± 5.3"
    unit: µg
    label: venom in a single detectable bite
    note: mean ± SE, 31 targets — not a gland's full reserve or a human dose
    sources: [nelsen2014]
observations:
  - id: duct
    text: Each venom gland in the prosoma connects to its own fang by a duct.
    sources: [snodgrass1952, reese1944]
  - id: outlet
    text: The fang outlet lies short of its extreme point.
    sources: [foelix2011]
  - id: relative
    text: In the theridiid Parasteatoda, too, a duct runs through the chelicera from gland to fang.
    confidence: supported
    sources: [hassan2024]
  - id: dry-then-wet
    text: Targets bitten repeatedly by western widows sometimes received a wet bite after a dry one.
    confidence: supported
    sources: [nelsen2014]
  - id: context
    text: Widows pinched on the body delivered more venom per bite than widows pinched on a leg.
    confidence: supported
    sources: [nelsen2014]
  - id: not-empty
    text: Dry bites cannot all be explained by the spider having run out of venom.
    confidence: supported
