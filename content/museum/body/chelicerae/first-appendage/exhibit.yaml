observations:
  - id: order
    text: The chelicerae come before the pedipalps in the spider's series of prosomal appendages.
    sources: [foelix2011]
  - id: behind
    text: In brown widow embryos the chelicerae still sit behind the mouth at the study's Step 6.
    confidence: supported
    sources: [liu2009]
  - id: beside
    text: By Step 7 they have moved to a position beside the mouth.
    confidence: supported
    sources: [liu2009]
  - id: adult
    text: In adult spiders the chelicerae lie in front of the mouth, beneath the front of the carapace.
    sources: [snodgrass1952]
  - id: hox
    text: Hox-gene expression in the spider Cupiennius matches the cheliceral segment with the segment that carries an insect's antennae.
    confidence: supported
    sources: [damen1998]
  - id: deutocerebrum
    text: In the modern scheme the chelicerae are innervated from the deutocerebrum, the second part of the arthropod brain.
