id: body.chelicerae.first-appendage
accession: BWM-01.05.01
title: The First Pair
kicker: First in the limb series, moving around the mouth
summary: Chelicerae give the chelicerates their name. They are the first of a spider's six pairs of appendages, and in the embryo they migrate from behind the mouth to in front of it. Gene expression places them on the same body segment as an insect's antennae, though their adult job is very different.
