id: body.chelicerae.feeding-tools
accession: BWM-01.05.09
title: Jaws That Don't Chew
kicker: Grip, release and regrip around a liquid meal
summary: Brown widows drain flies through small holes, leaving the husk largely intact, while their fangs keep changing grip. Under the microscope the meal moves through an exposed film of fluid, not a sealed straw. The chelicerae have other jobs too, including one in mating.
status: open
order: 9
taxa: [Latrodectus geometricus]
