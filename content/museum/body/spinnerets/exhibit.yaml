observations:
  - id: ampullate
    text: In female L. variolus each anterior lateral spinneret carries a major ampullate (dragline) spigot beside a field of small pyriform spigots.
    confidence: supported
    sources: [coddington1989]
  - id: minor
    text: Minor ampullate silk leaves through the posterior median spinnerets.
    confidence: supported
    sources: [coddington1989]
  - id: aciniform
    text: Aciniform spigots, for wrapping silk, sit on both posterior spinneret pairs.
    confidence: supported
    sources: [coddington1989]
  - id: tubuliform
    text: Cylindrical (tubuliform) spigots for egg-case silk sit on both posterior spinneret pairs of females.
    confidence: supported
    sources: [coddington1989]
  - id: aggregate
    text: Theridiid aggregate spigots — the glue nozzles — are enlarged and elongated compared with the outlets around them.
    sources: [coddington1989, miller2007]
  - id: aggregate-sizes
    text: In the western widow, the posterior aggregate glands feed larger spigots than the anterior ones.
    confidence: supported
