    text: The widow's flagelliform spigot remains tentatively identified; Coddington marked it with a question mark.
    confidence: debated
    sources: [coddington1989]
  - id: colulus
    text: Latrodectus keeps a conspicuous colulus, a small median lobe just in front of the spinnerets.
    sources: [lotz1994, jocque2006]
