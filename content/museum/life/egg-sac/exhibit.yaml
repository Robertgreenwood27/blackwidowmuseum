observations:
  - id: multiple
    text: Female black widows produce multiple egg sacs over their lives.
    sources: [kaston1970, vetter2017]
  - id: stored-sperm
    text: Redback females use sperm from one mating to make successive fertile sacs.
    sources: [mowery2022b]
  - id: food
    text: How often a redback makes a sac depends on how much she eats.
    confidence: supported
    sources: [mowery2022b, stoltz2010b]
  - id: pause
    text: Mated redbacks largely stopped making sacs when food was restricted, and resumed once feeding restarted.
    confidence: supported
    sources: [stoltz2010b]
  - id: no-decline
    text: Across 216 redback sacs, egg failure did not consistently rise or fall from one sac to the next.
    confidence: supported
    sources: [downes1985]
  - id: species-differ
    text: Western and brown widows differed in both egg number and egg size in a California comparison.
    confidence: supported
    sources: [vetter2012]
  - id: colour
    text: Eggs of southern, western and northern widows are usually cream to yellow.
    sources: [kaston1970, ebeling1975]
  - id: dud-eggs
    text: Inviable redback eggs have been proposed as a first meal for the young — an idea, not a demonstrated strategy.
    confidence: debated
    sources: [downes1985]
  - id: range
    text: Observed clutches range enormously — from a single egg to over nine hundred.
    sources: [kaston1970]
