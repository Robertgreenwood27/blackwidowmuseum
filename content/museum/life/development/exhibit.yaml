observations:
  - id: males-first
    text: Male western and southern widows matured earlier than females in Kaston's rearing series.
    confidence: supported
    sources: [kaston1970, ebeling1975]
  - id: protandry
    text: Western widow males also mature before females in the field.
    confidence: supported
    sources: [scott2019]
  - id: more-stages
    text: Redback females add more developmental stages and reach a much larger adult size.
    confidence: supported
    sources: [forster1995]
  - id: early-instars
    text: Early female redback instars can be shorter than males', despite females' longer total development.
    confidence: supported
    sources: [forster1995]
  - id: heat
    text: Western widow juveniles at urban-heat temperatures developed more slowly, not faster.
    confidence: supported
    sources: [moen2022]
  - id: hormones
    text: Heat delayed and shrank the moulting-hormone peak before the second moult.
    confidence: supported
    sources: [moen2022]
  - id: tradeoff
    text: Redback males near females traded faster maturity against adult condition.
    confidence: supported
    sources: [kasumovic2009]
