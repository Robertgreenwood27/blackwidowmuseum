observations:
  - id: breakage
    text: Redback males can leave broken embolus tips in the female's reproductive tract.
    sources: [snow2006]
  - id: placement
    text: Tips lodged at the entrance to a sperm store protected paternity better than tips elsewhere.
    confidence: supported
    sources: [snow2006]
  - id: not-automatic
    text: A broken tip is therefore not automatically an effective plug.
    confidence: supported
    sources: [snow2006]
  - id: removal
    text: Removing the tip experimentally did not stop the male from copulating and inseminating again.
    confidence: supported
    sources: [snow2006]
  - id: avoid
    text: Rival redback males tended to avoid sperm stores another male had already used.
    confidence: supported
    sources: [snow2005]
  - id: subadult
    text: Brown widow females mated before their final moult more often had both stores plugged.
    confidence: supported
    sources: [sentenska2021]
  - id: not-sterile
    text: Losing a tip did not stop southern widow males inseminating more females.
    sources: [breene1985]
terms:
  - { term: embolus, def: the part of the male palp inserted into the female }
  - { term: spermatheca, def: a female sperm-storage chamber; widows have two }
  - { term: sperm precedence, def: one male's sperm outcompeting another's by mating order }
