id: life.cannibalism
accession: BWM-05.09
title: How Much Widow Is in the Name?
kicker: Sexual cannibalism, species by species
summary: The name promises a female who eats her mate. In redbacks that is common. In southern black widows, in one study, it never happened.
status: open
order: 9
