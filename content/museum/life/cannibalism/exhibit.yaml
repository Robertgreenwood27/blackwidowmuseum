observations:
  - id: survivors
    text: Plenty of redback males survived mating in field observations.
    sources: [andrade1996]
  - id: species
    text: Under the same lab conditions, cannibalism rates differed sharply among five widow species.
    confidence: supported
    sources: [baruffaldi2024]
  - id: western
    text: Western widow males usually survived; the cannibalism recorded came before copulation.
    confidence: supported
    sources: [baruffaldi2024]
  - id: southern
    text: Southern widow males survived every interaction in the 2024 comparison.
    confidence: supported
    sources: [baruffaldi2024]
  - id: serial
    text: In an earlier study, two southern widow males each inseminated three different females.
    confidence: supported
    sources: [breene1985]
  - id: cost
    text: In redbacks, being eaten during the first copulation can deny a male his second sperm store.
    confidence: supported
    sources: [snow2005]
  - id: courtship-length
    text: How long males courted did not line up neatly with how cannibalistic each species was.
    confidence: supported
    sources: [baruffaldi2024]
