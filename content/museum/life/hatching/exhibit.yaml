observations:
  - id: inside
    text: Redbacks hatch inside the sac and undergo their first true moult before emerging.
    sources: [downes1987]
  - id: warmth
    text: Redback young reached emergence faster at 30 °C than at 25 °C.
    confidence: supported
    sources: [downes1987]
  - id: heat-cost
    text: Some sacs kept at 30 °C yielded only 10–20 spiderlings, and one produced none.
    confidence: supported
    sources: [downes1987]
  - id: movement
    text: Hatching inside intact sacs was detected from changes in how the egg mass moved.
    confidence: supported
    sources: [downes1987]
  - id: live-young
    text: Western and brown widow sacs can hold live, mobile spiderlings before they leave.
    sources: [vetter2012]
  - id: trapped
    text: Dead older spiderlings in some sacs suggest they failed to open an exit, not that they failed to hatch.
    confidence: supported
    sources: [vetter2012]
