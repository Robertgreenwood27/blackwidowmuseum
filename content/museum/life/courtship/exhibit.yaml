observations:
  - id: somersault
    text: During copulation, male redbacks somersault to place their abdomen over the female's mouthparts.
    sources: [andrade1996, forster1992]
  - id: second-palp
    text: A male who survives can withdraw, groom and mate again with his other palp.
    sources: [forster1992]
  - id: payoff
    text: Cannibalised males copulated longer and fertilised more eggs than males that survived.
    confidence: supported
    sources: [andrade1996]
  - id: receptivity
    text: Females that ate their mate were less likely to accept a second male.
    confidence: supported
    sources: [andrade1996]
  - id: threshold
    text: Rival males can slip in and benefit from the courtship another male has already done.
    confidence: supported
    sources: [stoltz2010]
  - id: sneakers
    text: Males that rush to mate risk being eaten before using both palps.
    confidence: supported
    sources: [stoltz2008]
  - id: female-control
    text: A female can limit a male's paternity by ending mating before both sperm stores are filled.
    confidence: supported
    sources: [snow2005]
  - id: immature
    text: Redback and brown widow males can mate with females days before their final moult, cutting through the covering cuticle.
    sources: [biaggio2016]
  - id: immature-safe
    text: Those immature matings rarely ended in cannibalism, and the sperm survived the female's moult.
    confidence: supported
    sources: [biaggio2016]
  - id: caveat
    text: This is the redback. Sexual cannibalism is frequent there, not inevitable — and not the rule for every widow.
    sources: [andrade1996, baruffaldi2024]
