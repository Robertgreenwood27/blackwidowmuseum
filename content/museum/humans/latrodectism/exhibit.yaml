observations:
  - id: mechanism
    text: Alpha-latrotoxin makes nerve terminals release their neurotransmitters, which links the venom to the symptoms.
    sources: [ryan2017]
  - id: symptoms
    text: Latrodectism can cause severe pain, muscle cramps, a rigid abdomen and heavy sweating.
    sources: [ryan2017]
  - id: autonomic
    text: It combines muscular symptoms with autonomic ones such as sweating and raised blood pressure.
    sources: [ryan2017]
  - id: variable
    text: Severity varies, and not every bite produces systemic illness.
    sources: [ryan2017, isbister2003]
  - id: grade-1
    text: In Clark's grading, grade 1 means no symptoms or only local pain, with normal vital signs.
    sources: [clark1992]
  - id: grade-2
    text: Grade 2 adds regional pain and local sweating, with normal vital signs.
    sources: [clark1992]
  - id: grade-3
    text: Grade 3 means generalised pain, sweating far from the bite and abnormal vital signs.
    sources: [clark1992]
  - id: redback-limb
    text: Regional limb pain is prominent in Australian redback bites.
    confidence: supported
    sources: [ryan2017]
  - id: abdomen
    text: In a Croatian hospital series, patients were first assessed for an abdominal emergency; two were referred to surgeons before the diagnosis was clarified.
    confidence: supported
    sources: [dzelalija2003]
  - id: rare-deaths
    text: Deaths are rare in the modern era; both large US poison-centre series recorded none.
    sources: [monte2011, kerns2025]
  - id: cardiac
    text: Published European cases include serious heart complications — reported cases, not a measure of how often they occur.
    confidence: supported
    sources: [terzi2026]
