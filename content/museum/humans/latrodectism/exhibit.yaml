id: humans.latrodectism
accession: BWM-07.01
title: Latrodectism
kicker: A small wound, a whole-body syndrome
summary: Widow venom can cause intense pain, muscle cramping and sweating far from the bite. Severity varies widely — many bites stay local — and a severe case can be mistaken for an abdominal emergency.
status: open
order: 1
taxa: [Latrodectus hasselti, Latrodectus hesperus, Latrodectus tredecimguttatus]
