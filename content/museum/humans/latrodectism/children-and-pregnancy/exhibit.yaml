observations:
  - id: presentation
    text: Irritability, high blood pressure and sweating together were the typical picture in Central Australian children.
    confidence: supported
    sources: [trethewy2003]
  - id: selected
    text: That series came from hospital discharge records, so it over-represents sicker children.
    sources: [trethewy2003]
  - id: ages
    text: Younger and older children in it did not differ significantly in signs or outcome.
    confidence: supported
    sources: [trethewy2003]
  - id: us-children
    text: In the US series, many children were grade 1, but over a third were grade 3.
    confidence: supported
    sources: [glatstein2018]
  - id: unavailable
    text: For 14 of the 20 severe cases who did not get antivenom, the recorded reason was that none was available.
    confidence: supported
    sources: [glatstein2018]
  - id: pregnant-admitted
    text: Pregnant patients were admitted more often than other women of reproductive age — 13.4% vs. 4.0%.
    confidence: supported
    sources: [wolfe2011]
  - id: no-losses
    text: No pregnancy losses were documented in that series.
    confidence: supported
    sources: [wolfe2011]
  - id: label
    text: Australian antivenom product information calls pregnancy data limited and inconclusive.
    sources: [seqirus2026]
terms:
  - { term: discharge diagnosis, def: the diagnosis recorded when a patient leaves hospital }
  - { term: clinical grade, def: a severity score from the patient's signs, not a poison-centre outcome label }
