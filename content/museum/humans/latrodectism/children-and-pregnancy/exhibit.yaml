id: humans.latrodectism.children-and-pregnancy
accession: BWM-07.01.02
title: Children and Pregnancy
kicker: Special patients need their own evidence
summary: Young children may arrive irritable and sweating, with no story of a bite. Pregnancy reports are reassuring about short-term outcomes, but the evidence is thin.
status: open
order: 2
taxa: [Latrodectus hasselti, Latrodectus]
