id: humans.who-gets-bitten
accession: BWM-07.04
title: Who Gets Bitten?
kicker: Exposure follows seasons, work and everyday contact
summary: Poison-centre and hospital records show bites peaking in late summer, mostly in men, often on hands and feet. But each dataset counts something different, and none measures true risk.
status: open
order: 4
taxa: [Latrodectus, Latrodectus hasselti, Latrodectus tredecimguttatus]
