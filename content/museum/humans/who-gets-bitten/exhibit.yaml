observations:
  - id: september
    text: Both large US poison-centre studies found reports peaked in September.
    confidence: supported
    sources: [monte2011, kerns2025]
  - id: winter
    text: Winter months had the fewest reports.
    confidence: supported
    sources: [monte2011, kerns2025]
  - id: men
    text: Men made up the majority of patients in both US datasets.
    confidence: supported
    sources: [monte2011, kerns2025]
  - id: redback-summer
    text: Historical redback reports clustered in summer, in the afternoon and evening.
    confidence: supported
    sources: [sutherland1978]
  - id: buttocks
    text: Bites to the genitals or buttocks made up 9.7% of the historical redback series — the outdoor-toilet era.
    confidence: supported
    sources: [sutherland1978]
  - id: clothing
    text: Clothing and shoes were recorded circumstances in an Arizona hospital series.
    confidence: supported
    sources: [clark1992]
  - id: europe
    text: Published European cases come mostly from Mediterranean farming regions in summer.
    confidence: supported
    sources: [terzi2026]
  - id: france
    text: French poison centres attributed 46 of 1,194 native-spider reports to Latrodectus.
    confidence: supported
    sources: [leroux2022]
