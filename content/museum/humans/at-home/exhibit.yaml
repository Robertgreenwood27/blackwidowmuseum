id: humans.at-home
accession: BWM-07.10
title: Widows in the Home
kicker: Shelter brings spiders and people together
summary: Widows use the sheltered corners people build — patio furniture, sheds, outbuildings, clutter. Experiments show they bite mainly when pinched, and often hold back their venom.
status: open
order: 10
taxa: [Latrodectus geometricus, Latrodectus hesperus]
