id: humans.myth
accession: BWM-07.03
title: The Widow in Myth
kicker: A name can outgrow the animal
summary: The widow's name comes from a real but variable habit — females eating mates. The tarantism of southern Italy adds a stranger history, in which real pain, blamed spiders and healing music became one cultural ritual.
