id: humans.antivenom
accession: BWM-07.02
title: Antivenom
kicker: Antibodies, relief, and a hard test of evidence
summary: Widow antivenoms are made from the blood of immunised horses and have been used for ninety years. Randomised trials have given conflicting answers about how much they help, and the debate is still open.
status: open
order: 2
taxa: [Latrodectus hasselti, Latrodectus mactans]
