observations:
  - id: horses
    text: The Australian antivenom is made from the plasma of horses immunised with female redback venom.
    sources: [seqirus2026]
  - id: products
    text: The older US Merck antivenin and the purified F(ab′)₂ product tested later are different formulations.
    sources: [ryan2017, dart2019]
  - id: rave-1
    text: RAVE-I compared two routes of giving antivenom and found no clear advantage for either.
    confidence: supported
    sources: [isbister2008]
  - id: rave-2
    text: RAVE-II compared antivenom with placebo after standard pain relief, and found no significant extra benefit at two hours.
    confidence: supported
    sources: [isbister2014]
  - id: us-2013
    text: A small 2013 US trial missed its main endpoint but found faster improvement on a secondary one.
    confidence: supported
    sources: [dart2013]
  - id: us-2019
    text: A larger US trial of a purified product reported fewer treatment failures than placebo.
    confidence: supported
    sources: [dart2019]
  - id: debate
    text: Whether antivenom helps appears to depend on the product, the setting and what is measured.
    confidence: debated
    sources: [ryan2017, isbister2014, dart2019]
  - id: cross
    text: In the laboratory, redback antivenom neutralised the venoms of other widow species.
    confidence: supported
    sources: [graudins2001]
  - id: allergy
    text: Product information lists both immediate allergic reactions and delayed serum sickness.
    sources: [seqirus2026]
  - id: california
    text: A California series of 96 treated patients found no severe allergic reactions.
    confidence: supported
    sources: [nordt2012]
  - id: argentina
    text: Argentina's national institute manufactures an equine F(ab′)₂ widow antivenom.
    sources: [ministeriodesalud2025]
  - id: south-africa
    text: South Africa's national laboratory service manufactures its spider antivenom.
    sources: [nationalhealthlaboratoryservice2024]
terms:
  - { term: antivenom, def: antibodies that neutralise venom toxins — also called antivenin }
  - { term: F(ab′)₂, def: a trimmed antibody fragment that keeps both binding arms }
  - { term: serum sickness, def: a delayed immune reaction to foreign proteins }
  - { term: placebo-controlled, def: compared against an inactive treatment under the same protocol }
