id: humans.stowaways
accession: BWM-07.08
title: Stowaways
kicker: A bunch of grapes can carry more than fruit
summary: Widows travel as accidental passengers in grapes, cars and freight. Border records document real interceptions, but arriving is not the same as establishing.
status: open
order: 8
taxa: [Latrodectus hesperus, Latrodectus hasselti, Latrodectus geometricus]
