observations:
  - id: grapes
    text: New Zealand's 2002 risk assessment documents widows among spiders intercepted on imported grapes.
    sources: [reed2002]
  - id: which
    text: Recorded grape passengers included redbacks and western black widows.
    sources: [reed2002]
  - id: post-border
    text: Some were found after the border, not at inspection.
    sources: [reed2002]
  - id: arrival
    text: An interception proves arrival, not a breeding population.
    sources: [reed2002, noordijk2016]
  - id: pathways
    text: Dutch records include widows arriving with vehicles, plants and industrial goods.
    sources: [noordijk2016]
  - id: hatched
    text: Redback eggs hatched in one intercepted Dutch shipment.
    confidence: supported
    sources: [noordijk2016]
  - id: shelter
    text: Grape bunches give widows shelter and hunting ground, not food.
    sources: [ministryforprimaryindustries2022]
  - id: low-oxygen
    text: Killing spiders on grapes depended on both oxygen level and temperature, without harming the fruit.
    confidence: supported
    sources: [liu2008]
  - id: standard
    text: A 2026 New Zealand grape import standard names several widow species.
    sources: [ministryforprimaryindustries2026]
