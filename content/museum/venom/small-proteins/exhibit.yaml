observations:
  - id: companions
    text: Small low-molecular-weight proteins were isolated from widow venom and found associated with purified α-latrotoxin.
    confidence: supported
    sources: [volkova1995]
  - id: not-toxic-alone
    text: On their own, those proteins caused neither toxicity in mice nor paralysis in cockroaches at the doses tested.
    confidence: supported
    sources: [volkova1995]
  - id: hormone-ancestry
    text: Their sequence and disulfide pattern place them in the same family as crustacean hyperglycaemic hormones.
    confidence: supported
    sources: [gasparini1994]
  - id: recruitment
    text: Latrodectin sequences support recruitment of a neuropeptide hormone family into venom.
    confidence: supported
    sources: [mccowan2014]
  - id: intron-position
    text: A western widow latrodectin gene shares an intron position with its hormone relatives.
    confidence: supported
    sources: [mccowan2014]
  - id: interaction
    text: Antibodies against these small proteins altered the calcium influx and transmitter release caused by α-latrotoxin.
    confidence: supported
    sources: [grishin1993]
  - id: unresolved
    text: Their natural role remains unresolved — hormone ancestry does not mean they act as hormones in prey.
    confidence: supported
    sources: [mccowan2014]
  - id: others
    text: Widow venom also contains cysteine-rich secretory proteins, knotted peptides, hyaluronidases, chitinase and proteases.
    confidence: supported
    sources: [haney2014]
  - id: names-not-functions
    text: Belonging to one of those protein families does not by itself establish what a component does in prey.
    confidence: supported
    sources: [haney2014]
terms:
