id: venom.small-proteins
accession: BWM-02.07
title: The Small Constituents
kicker: Hormones turned into venom
summary: Travelling with the giant toxins are small proteins called latrodectins, descended from an arthropod hormone family. What they are for is still an open question.
status: open
order: 7
taxa: [Latrodectus tredecimguttatus, Latrodectus hesperus, Latrodectus geometricus]
