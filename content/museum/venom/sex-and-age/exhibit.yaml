    label: proteins detected in spiderling body extracts
    note: not a count of venom toxins
    sources: [peng2020]
  - value: 958
    label: proteins detected in adult body extracts
    note: same study; detection depends on method
    sources: [peng2020]
observations:
  - id: gland-size
    text: Micro-CT of adult western widows showed relatively larger venom glands in the female than in the male.
    confidence: supported
    sources: [miller2026]
  - id: gland-shape
    text: The rear portions of the glands diverged in the female specimen but not in the male.
    confidence: supported
    sources: [miller2026]
  - id: ubiquitous-alpha
    text: In brown and southern widows, α-latrotoxin transcripts turned up in every tissue and life stage sampled, including eggs.
    confidence: supported
    sources: [torres2022]
  - id: female-only
    text: δ-latroinsectotoxin transcripts were detected only in females.
    confidence: supported
    sources: [torres2022]
  - id: not-in-eggs
    text: Neither insect toxin tested was detected in the eggs of those species.
    confidence: supported
    sources: [torres2022]
  - id: variable
    text: α-latroinsectotoxin detection varied between spiderling and adult samples.
    confidence: supported
    sources: [torres2022]
  - id: transcripts-not-potency
    text: That screen measured the presence of transcripts, not how much toxin is secreted or how a bite would act.
    confidence: supported
    sources: [torres2022]
  - id: spiderlings
    text: Extracts of newborn widows affected nerve preparations and ion currents, showing bioactivity without saying anything about a spiderling's bite.
    confidence: supported
    sources: [peng2014]
  - id: development
    text: Spiderling and adult body proteomes differed in complexity and in the spread of protein masses.
    confidence: supported
    sources: [peng2020]
