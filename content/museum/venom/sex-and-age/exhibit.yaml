id: venom.sex-and-age
accession: BWM-02.10
title: Venom Across a Lifetime
kicker: Not every widow carries the same chemistry
summary: Gland size differs between the sexes and toxin genes switch on and off across tissues and life stages. One toxin gene has been found switched on everywhere, even in eggs.
status: open
order: 10
taxa: [Latrodectus hesperus, Latrodectus geometricus, Latrodectus mactans, Latrodectus tredecimguttatus]
