id: venom.latrotoxin-genes
accession: BWM-02.12
title: The Genetic Toolkit
kicker: One gene family, copied and copied again
summary: The handful of toxins named last century turns out to be the visible part of a large, duplicated gene family — and in the venom gland those genes are among the busiest in the animal.
status: open
order: 12
taxa: [Latrodectus hesperus, Latrodectus tredecimguttatus, Latrodectus elegans, Latrodectus mactans, Latrodectus geometricus]
