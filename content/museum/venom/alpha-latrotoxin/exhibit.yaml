id: venom.alpha-latrotoxin
accession: BWM-02.01
title: α-Latrotoxin
kicker: A key that becomes a hole
summary: The vertebrate toxin binds to nerve endings, assembles into a four-part ring and punches a pore through the membrane — and the synapse empties itself. It also works by a second route that needs no pore at all.
status: open
order: 1
taxa: [Latrodectus tredecimguttatus]
