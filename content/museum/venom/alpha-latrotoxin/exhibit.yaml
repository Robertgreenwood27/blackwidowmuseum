observations:
  - id: precursor
    text: The toxin is made as a much longer precursor and matured by cutting away propeptides at both ends.
    confidence: supported
    sources: [volynski1999, kiyatkin1990]
  - id: tetramer
    text: Mature α-latrotoxin assembles into tetramers that insert into presynaptic membranes.
    sources: [klink2024, orlova2000]
  - id: pore
    text: The inserted tetramer forms a cation-selective, calcium-permeable pore.
    sources: [klink2024]
  - id: receptors
    text: It binds neurexins, latrophilin-1 (ADGRL1) and the phosphatase PTPσ — three distinct receptor families.
    sources: [ushkaryov2008, krasnoperov2002]
  - id: calcium-conditions
    text: Binding to neurexin requires calcium; binding to latrophilin does not.
    sources: [ushkaryov2008]
  - id: release
    text: The result is massive release of neurotransmitter from the nerve terminal.
    sources: [ushkaryov2008]
  - id: motor-terminal
    text: At frog neuromuscular junctions the toxin raises the rate of release and then strips the terminal of its synaptic vesicles.
    confidence: supported
    sources: [ceccarelli1980]
  - id: brain
    text: In preparations of rat nerve endings it drives release of both glutamate and GABA.
    confidence: supported
    sources: [ashton2001]
  - id: not-only-pores
    text: Pore formation is not the whole story — a mutant toxin that cannot form pores still triggers secretion through its receptors.
    confidence: supported
    sources: [volynski2003, ushkaryov2008]
  - id: selectivity
    text: Recombinant α-latrotoxin was not toxic to moth larvae under conditions where the insect toxin was, supporting receptor recognition as the basis of its vertebrate selectivity.
    confidence: supported
    sources: [kiyatkin1995, magazanik1992]
