observations:
  - id: five
    text: Five insect-active neurotoxins were separated from Mediterranean widow venom by chromatography.
    confidence: supported
    sources: [krasnoperov1990]
  - id: blowfly
    text: Purified α-latroinsectotoxin sharply raised the rate of spontaneous transmitter release at blowfly larval neuromuscular junctions.
    confidence: supported
    sources: [magazanik1992]
  - id: frog-control
    text: The same toxin failed to affect frog nerve endings under conditions where it was strongly active in the blowfly — the mirror image of α-latrotoxin.
    confidence: supported
    sources: [magazanik1992]
  - id: family
    text: Sequencing showed α-latroinsectotoxin is a relative of α-latrotoxin, sharing its abundance of ankyrin-like repeats.
    confidence: supported
    sources: [kiyatkin1993]
  - id: truncation
    text: A shortened recombinant δ-latroinsectotoxin was active on locust nerve terminals while the full-length product was not.
    confidence: supported
    sources: [dulubova1996]
  - id: channels
    text: Recombinant δ-latroinsectotoxin formed ion-conducting channels in artificial lipid membranes.
    confidence: supported
    sources: [dulubova1996, chen2021]
  - id: structure
    text: The 2021 structure of the δ-latroinsectotoxin precursor dimer assigned fifteen ankyrin repeats to each subunit.
    confidence: supported
    sources: [chen2021]
  - id: uneven-knowledge
    text: β-, γ- and ε-latroinsectotoxin were shown to be insect-active, but their mechanisms are far less studied than α and δ.
