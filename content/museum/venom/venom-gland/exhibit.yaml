observations:
  - id: location
    text: Micro-CT places the widow's paired venom glands inside the prosoma, not in the chelicerae.
    sources: [miller2026]
  - id: duct
    text: Each gland narrows abruptly into a duct that runs through the chelicera toward the opening near the fang tip.
    confidence: supported
    sources: [miller2026]
  - id: layers
    text: Reese described an outer muscle layer, a connective basement membrane and an inner secretory tissue.
    confidence: supported
    sources: [reese1944]
