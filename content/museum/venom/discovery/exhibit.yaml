id: venom.discovery
accession: BWM-02.16
title: Learning to See the Toxin
kicker: A century from self-experiment to structure
summary: The science began with entomologists letting a widow bite them and deadpanning the results. A hundred years later the same molecule was caught on camera turning itself into a pore.
