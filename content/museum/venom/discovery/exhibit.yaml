observations:
  - id: baerg
    text: Baerg's 1923 paper documented his own deliberate envenomation the previous year.
    confidence: supported
    sources: [baerg1923]
  - id: blair
    text: Blair's 1934 paper reported a carefully observed bite he had arranged for himself in 1933.
    confidence: supported
    sources: [blair1934]
  - id: frontali
    text: In 1976 Frontali and colleagues isolated the venom protein that depletes synaptic vesicles.
    confidence: supported
    sources: [frontali1976]
  - id: grasso
    text: The same year Grasso described a homogeneous ~130 kDa neurotoxin that released noradrenaline from rat nerve endings.
    confidence: supported
    sources: [grasso1976]
  - id: cloning
    text: In 1990 a cDNA sequence revealed the 1,401-amino-acid precursor of α-latrotoxin.
    sources: [kiyatkin1990]
  - id: first-3d
    text: Orlova and colleagues produced the first three-dimensional reconstruction in 2000, resolving dimers and tetramers.
    sources: [orlova2000]
  - id: resolution
    text: Those reconstructions reached 18 Å for dimers and 14 Å for tetramers — enough for shape, not for atoms.
    confidence: supported
    sources: [orlova2000]
  - id: family-2021
    text: In 2021 cryo-EM extended structural knowledge to the crustacean and insect toxins.
    confidence: supported
    sources: [chen2021]
  - id: transition
    text: In 2024 the prepore and pore structures revealed the rearrangement that drives the toxin into the membrane.
    confidence: supported
    sources: [klink2024]
