id: venom.venom-in-eggs
accession: BWM-02.09
title: Toxins Beyond the Fang
kicker: What is in the eggs
summary: Widow eggs contain bioactive proteins of their own, unrelated to the venom gland. They are usually explained as a defence for the eggs — a reasonable idea that remains untested.
status: open
order: 9
taxa: [Latrodectus tredecimguttatus]
