observations:
  - id: purified
    text: Latroeggtoxin-I was purified from Mediterranean widow eggs by gel filtration and ion-exchange chromatography.
    confidence: supported
    sources: [li2013]
  - id: neuromuscular
    text: It reversibly blocked neuromuscular transmission in an isolated mouse preparation.
    confidence: supported
    sources: [li2013]
  - id: insect-active
    text: Latroeggtoxin-III was neurotoxic to cockroaches but produced no obvious effect in the mice tested.
    confidence: supported
    sources: [lei2015]
  - id: antibacterial
    text: Latroeggtoxin-IV inhibited all five bacteria tested, most strongly Staphylococcus aureus.
    confidence: supported
    sources: [lei2015]
  - id: hemolymph
    text: A toxin purified from widow hemolymph differed from the neurotoxins known from venom.
    confidence: supported
    sources: [akhunov2001]
  - id: body-extracts
    text: Comparative proteomics found toxin-related proteins in extracts of both newborn and adult widows.
    confidence: supported
    sources: [peng2020]
  - id: not-latrotoxins
    text: An egg transcriptome study did not find the familiar latrotoxins of the venom gland, so the egg proteins are a separate set.
    confidence: supported
    sources: [xu2016]
  - id: defence-proposed
    text: Defence against predators or parasites is a proposed function for egg toxicity, not an established one.
    confidence: debated
    sources: [schmidt2017]
  - id: route-matters
    text: Toxicity after injection says nothing about protection from being eaten; feeding tests found no toxic effect when mice ate widow eggs.
    confidence: supported
    sources: [schmidt2017]
