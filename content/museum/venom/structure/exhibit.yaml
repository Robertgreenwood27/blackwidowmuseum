observations:
  - id: shared-plan
    text: The solved structures of α-latrotoxin, α-latrocrustatoxin and δ-latroinsectotoxin share connector, helical-bundle, plug and ankyrin-repeat domains.
    confidence: supported
    sources: [chen2021, klink2024]
  - id: cations
    text: Orlova and colleagues found the toxin as dimers when divalent cations were removed and as tetramers once calcium or magnesium was added.
    confidence: supported
    sources: [orlova2000]
  - id: first-structure
    text: That 2000 study reconstructed the tetramer at about 14 Å and showed it associating with membrane pores.
    confidence: supported
    sources: [orlova2000]
  - id: family-structures
    text: In 2021 cryo-EM resolved an α-latrocrustatoxin monomer and an uncleaved δ-latroinsectotoxin precursor dimer.
    confidence: supported
    sources: [chen2021]
  - id: dimer-interface
    text: In that dimer, one subunit's plug domain packs against the ankyrin repeats of its neighbour.
    confidence: supported
    sources: [chen2021]
  - id: prepore
    text: In 2024 the tetramer was resolved in both a prepore and a pore conformation, revealing the rearrangement between them.
    confidence: supported
    sources: [klink2024]
  - id: modelled-tip
    text: The membrane-inserting helical barrel had to be modelled, because its tip was not resolved by cryo-EM.
    confidence: supported
    sources: [klink2024]
  - id: lateral-entry
    text: In the model, ions enter the channel sideways near the membrane rather than passing down the whole length of the stalk.
    confidence: supported
    sources: [klink2024]
  - id: repeats-vary
    text: Repeat counts differ between family members, so the 22 of α-latrotoxin should not be read across the whole family.
    confidence: supported
    sources: [chen2021, klink2024]
