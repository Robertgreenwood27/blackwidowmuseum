id: venom.structure
accession: BWM-02.04
title: Toxin Architecture
kicker: Ankyrin repeats and the prepore
summary: "All the latrotoxins share one shape: a business end, a connector, and a long tail of stacked repeats. Cryo-EM has now caught α-latrotoxin in the act of turning from an assembled ring into a pore."
status: open
order: 4
taxa: [Latrodectus tredecimguttatus]
