id: venom.false-widows
accession: BWM-02.11
title: The False Widows
kicker: Relatives carrying the same weapons
summary: Latrotoxins are not a widow invention. Steatoda and the common house spider carry whole families of them — which is why redback antivenom works against a false widow's venom in the laboratory.
status: open
order: 11
taxa: [Steatoda grossa, Steatoda nobilis, Parasteatoda tepidariorum, Latrodectus hesperus]
