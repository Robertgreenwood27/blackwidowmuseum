observations:
  - id: steatoda-families
    text: Noble false widow venom contains proteins annotated as α-latrotoxins, δ-latroinsectotoxins and latrodectins.
    confidence: supported
    sources: [dunbar2020]
  - id: annotation-caveat
    text: Those annotations establish sequence relationships, not verified targets for each protein.
    confidence: supported
    sources: [dunbar2020]
  - id: divergent
    text: The cupboard spider's α-latrotoxin is a substantially divergent relative, not a copy of the widow's.
    confidence: supported
    sources: [garb2013]
  - id: similar-effects
    text: Cupboard spider venom produced dose-dependent effects resembling widow venom in an isolated nerve–muscle preparation.
    confidence: supported
    sources: [graudins2002]
  - id: antibodies
    text: That venom reacted with redback antivenom and with latrotoxin-specific antibodies.
    confidence: supported
    sources: [graudins2002]
  - id: neutralisation
    text: Redback antivenom both prevented and reversed its effects in that preparation.
    confidence: supported
    sources: [graudins2002]
  - id: tandem
    text: Many house spider latrotoxin genes sit in tandem arrays, the signature of repeated duplication.
    confidence: supported
    sources: [gendreau2017]
  - id: no-vertebrate-toxin
    text: The house spider genome lacked an identifiable counterpart of the vertebrate-specific α-latrotoxin found in widows and Steatoda.
    confidence: supported
    sources: [gendreau2017]
  - id: alternative-transcripts
    text: In the house spider, a single gene can contribute several different proteins to venom through alternative transcripts.
    confidence: supported
    sources: [haney2019]
terms:
  - { term: homolog, def: a gene or protein related to another by shared ancestry }
  - { term: ortholog, def: a homolog whose divergence traces to a species split }
  - { term: tandem duplication, def: duplication that leaves the copies side by side on a chromosome }
  - { term: cross-neutralisation, def: antibodies raised against one venom reducing the activity of another }
